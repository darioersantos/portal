<style>
  :root{
    --bg:#f6f5f3;--card:#ffffff;--ink:#1a1303;--muted:#7c7264;--line:#ece7df;
    --accent:#FF8100;--accent-dark:#E06E00;--accent-soft:#ffe7cf;--accent-ink:#8a4500;
    --neg:#dc2626;--pos:#15803d;--shadow:0 1px 2px rgba(26,19,3,.06),0 4px 16px rgba(26,19,3,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;overscroll-behavior:none;touch-action:pan-y;}
  body{overflow-x:clip;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;padding-bottom:40px;-webkit-text-size-adjust:100%;}

  header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#FF8100,#E66200);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;box-shadow:0 2px 12px rgba(230,98,0,.28);}
  .h-top{display:flex;align-items:center;gap:12px;justify-content:space-between;max-width:880px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:11px;min-width:0;}
  .logo{width:50px;height:50px;border-radius:12px;flex:none;background:#fff;padding:4px;box-shadow:0 2px 9px rgba(0,0,0,.2);}
  .logo img{width:100%;height:100%;border-radius:8px;display:block;object-fit:cover;}
  .brand h1{font-size:17px;margin:0;font-weight:800;line-height:1.1;}
  .brand p{font-size:12px;margin:2px 0 0;color:#fff;font-weight:600;}
  .icon-btn{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:10px;padding:8px 12px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;}

  main{max-width:760px;margin:0 auto;padding:14px 12px 24px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin:12px 0;}
  .card h2{font-size:15px;margin:0 0 12px;font-weight:800;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px;}
  .field select{width:100%;max-width:100%;min-width:0;box-sizing:border-box;-webkit-appearance:none;appearance:none;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);}
  .field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);min-height:80px;resize:vertical;}
  #texto{min-height:50vh;}
  .field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);}
  .save{width:100%;background:var(--accent);color:#fff;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(230,98,0,.3);display:flex;align-items:center;justify-content:center;gap:8px;}
  .save:disabled{opacity:.6;}
  .status{text-align:center;color:var(--muted);font-size:13px;padding:16px;}

  .nota{display:flex;align-items:flex-start;gap:11px;padding:13px;border:1px solid var(--line);border-radius:12px;margin-top:10px;background:#fff;}
  .nota .chk{flex:none;width:24px;height:24px;border:2px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;margin-top:1px;}
  .nota.done .chk{background:var(--pos);border-color:var(--pos);color:#fff;}
  .nota .info{flex:1;min-width:0;}
  .nota .txt{font-size:15px;font-weight:600;word-break:break-word;line-height:1.5;}
  .nota .txt .md-h{font-weight:800;color:var(--accent-ink);margin:8px 0 3px;line-height:1.25;}
  .nota .txt .md-h:first-child{margin-top:0;}
  .nota .txt .md-h1{font-size:17px;} .nota .txt .md-h2{font-size:16px;} .nota .txt .md-h3{font-size:15px;}
  .nota .txt .md-ul{margin:3px 0;padding-left:20px;} .nota .txt .md-ul li{margin:2px 0;}
  .nota .txt .md-p{margin:3px 0;} .nota .txt .md-sp{height:6px;} .nota .txt b{font-weight:800;}
  .nota .txt .md-hr{border:none;border-top:1px solid var(--line);margin:9px 0;}
  .nota.done .txt{text-decoration:line-through;color:var(--muted);font-weight:500;}
  .nota .meta{font-size:12px;color:var(--muted);margin-top:6px;}
  .nota .del{background:none;border:none;color:var(--neg);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;flex:none;padding:2px 4px;}

  #printArea{display:none;}
  @media print{
    header,main,#toast{display:none !important;}
    #printArea{display:block !important;color:#000;font-size:13px;padding:0;}
    #printArea h1{font-size:18px;margin:0 0 2px;color:#000;}
    #printArea .pdia{font-size:25px;font-weight:800;color:#1a1303;margin:0 0 2px;text-transform:capitalize;}
    #printArea .psub{font-size:12px;color:#555;margin-bottom:14px;border-bottom:2px solid #FF8100;padding-bottom:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    #printArea .pnote{padding:11px 0;border-bottom:1px solid #eee;page-break-inside:avoid;font-size:15px;line-height:1.45;}
    #printArea .pnote:last-child{border-bottom:none;}
    #printArea .md-h{font-weight:800;color:#8a4500;margin:9px 0 3px;} #printArea .pnote>.md-h:first-child{margin-top:0;}
    #printArea .md-h1{font-size:17px;} #printArea .md-h2{font-size:16px;} #printArea .md-h3{font-size:15px;}
    #printArea .md-ul{margin:3px 0;padding-left:20px;} #printArea .md-ul li{margin:2px 0;}
    #printArea .md-p{margin:3px 0;} #printArea .md-sp{height:6px;} #printArea b{font-weight:800;}
    #printArea .md-hr{border:none;border-top:1px solid #ccc;margin:8px 0;}
    #printArea .who{font-size:12px;color:#555;font-style:italic;margin-top:7px;}
  }
</style>
</head>

<style>
  .ttl-ic{width:18px;height:18px;vertical-align:-3px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .intro{font-size:13px;color:var(--muted);margin:0 0 4px;}
  .days{display:flex;flex-wrap:wrap;gap:8px;}
  .days button{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 15px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;min-width:52px;}
  .days button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .quick button{background:none;border:none;color:var(--accent-dark);font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;padding:2px 2px;text-decoration:underline;}
  .field input[type="time"]{width:100%;max-width:100%;min-width:0;box-sizing:border-box;-webkit-appearance:none;appearance:none;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);}
  .field input[type="time"]:focus{outline:none;border-color:var(--accent);}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;}
  .nt{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px;background:#fff;}
  .nt.off{opacity:.6;}
  .nt .bar{display:flex;align-items:center;gap:10px;background:#1a1303;color:#fff;border-radius:12px;padding:12px 14px;}
  .nt .bar .ic svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none;}
  .nt .bar .txt{font-size:14px;font-weight:700;line-height:1.35;word-break:break-word;}
  .nt .cfg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:11px;}
  .nt .tag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;border-radius:999px;padding:4px 10px;}
  .nt .tag.day{background:#eef1f4;color:#3a3a3a;}
  .nt .tag.time{background:#e7f0ff;color:#1e50a8;}
  .nt .tag.st{background:var(--accent-soft);color:var(--accent-ink);}
  .nt .tag.st.no{background:#f0eeeb;color:#8a8378;}
  .nt .acts{display:flex;gap:8px;margin-top:12px;}
  .nt .acts button{flex:1;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;}
  .nt .btn-toggle{background:var(--accent-soft);color:var(--accent-ink);}
  .nt .btn-del{background:#fdeaea;color:var(--neg);}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1a1303;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:200;box-shadow:0 8px 28px rgba(0,0,0,.25);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>

<main>
  <div class="card">
    <h2>Nova notifica&#xE7;&#xE3;o</h2>
    <p class="intro">Aparece como uma barra preta no topo do menu, nos dias que escolheres.</p>
    <div class="field"><label for="msg">Mensagem</label><textarea id="msg" placeholder="Ex.: Staff todo: limpar a loja antes das 10:00." style="min-height:90px;"></textarea></div>
    <div class="field">
      <label>Dias em que aparece</label>
      <div class="days" id="days"></div>
      <div class="quick"><button type="button" data-q="week">Seg a Sex</button><button type="button" data-q="all">Todos os dias</button><button type="button" data-q="clear">Limpar</button></div>
    </div>
    <div class="field">
      <label for="ate">Mostrar at&#xE9; &#xE0;s (opcional)</label>
      <input type="time" id="ate">
      <div class="hint">Se preencheres, a notifica&#xE7;&#xE3;o desaparece a partir dessa hora. Deixa vazio para aparecer o dia todo.</div>
    </div>
    <button class="save" id="btnSave"><i data-lu="plus"></i> Criar notifica&#xE7;&#xE3;o</button>
  </div>

  <div class="card">
    <h2>Notifica&#xE7;&#xF5;es agendadas</h2>
    <div id="lista"><div class="status">A carregar&#x2026;</div></div>
  </div>
</main>

<div id="toast"></div>

<script>
"use strict";
var BACKEND=(typeof window!=='undefined'&&window.BACKEND_URL?String(window.BACKEND_URL).trim():'');
var SEC='_notif';
var DIAS=[{v:1,l:'Seg'},{v:2,l:'Ter'},{v:3,l:'Qua'},{v:4,l:'Qui'},{v:5,l:'Sex'},{v:6,l:'S\u00E1b'},{v:0,l:'Dom'}];
var DIAS_LONG={0:'Domingo',1:'Segunda',2:'Ter\u00E7a',3:'Quarta',4:'Quinta',5:'Sexta',6:'S\u00E1bado'};
var BELL='<svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>';
var NOTIFS=[];
var sel=new Set();
function byId(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(m){var t=byId('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}

(function(){var d=byId('days');DIAS.forEach(function(x){var b=document.createElement('button');b.type='button';b.textContent=x.l;b.dataset.v=x.v;b.onclick=function(){if(sel.has(x.v)){sel.delete(x.v);b.classList.remove('on');}else{sel.add(x.v);b.classList.add('on');}};d.appendChild(b);});})();
function paintDays(){document.querySelectorAll('.days button').forEach(function(b){b.classList.toggle('on',sel.has(+b.dataset.v));});}
document.querySelectorAll('.quick button').forEach(function(b){b.onclick=function(){var q=b.dataset.q;sel.clear();if(q==='week'){[1,2,3,4,5].forEach(function(d){sel.add(d);});}else if(q==='all'){[0,1,2,3,4,5,6].forEach(function(d){sel.add(d);});}paintDays();};});

function diasTxt(arr){if(!Array.isArray(arr)||!arr.length)return '\u2014';if(arr.length===7)return 'Todos os dias';if(arr.length===5&&[1,2,3,4,5].every(function(d){return arr.indexOf(d)>=0;}))return 'Seg a Sex';if(arr.length===2&&arr.indexOf(0)>=0&&arr.indexOf(6)>=0)return 'Fim de semana';return arr.slice().sort(function(a,b){return (a===0?7:a)-(b===0?7:b);}).map(function(d){return DIAS_LONG[d];}).join(', ');}

function render(){
  var l=byId('lista'); l.innerHTML='';
  if(!NOTIFS.length){ l.innerHTML='<div class="status">Ainda n\u00E3o h\u00E1 notifica\u00E7\u00F5es. Cria a primeira acima.</div>'; return; }
  NOTIFS.forEach(function(n){
    var cfg={}; try{cfg=JSON.parse(n.texto)||{};}catch(e){cfg={};}
    var off=(n.done===true||String(n.done).toLowerCase()==='true');
    var card=document.createElement('div'); card.className='nt'+(off?' off':'');
    var tags='<span class="tag day">'+esc(diasTxt(cfg.dias))+'</span>';
    if(cfg.ate) tags+='<span class="tag time">at\u00E9 '+esc(cfg.ate)+'</span>';
    tags+='<span class="tag st'+(off?' no':'')+'">'+(off?'Inativa':'Ativa')+'</span>';
    card.innerHTML='<div class="bar"><span class="ic">'+BELL+'</span><span class="txt">'+esc(String(cfg.msg||''))+'</span></div>'
      +'<div class="cfg">'+tags+'</div>'
      +'<div class="acts"><button class="btn-toggle">'+(off?'Ativar':'Desativar')+'</button><button class="btn-del">Apagar</button></div>';
    card.querySelector('.btn-toggle').onclick=function(){ toggle(n,!off); };
    card.querySelector('.btn-del').onclick=function(){ if(confirm('Apagar esta notifica\u00E7\u00E3o?')) del(n); };
    l.appendChild(card);
  });
}
function carregar(){
  if(!BACKEND){ byId('lista').innerHTML='<div class="status">Sem liga\u00E7\u00E3o \u00E0 nuvem.</div>'; return; }
  fetch(BACKEND+'?action=notas&t='+Date.now()).then(function(r){return r.json();}).then(function(j){
    if(j&&j.ok&&Array.isArray(j.notas)){ NOTIFS=j.notas.filter(function(x){return String(x.seccao)===SEC;}); render(); }
    else byId('lista').innerHTML='<div class="status">N\u00E3o foi poss\u00EDvel carregar.</div>';
  }).catch(function(){ byId('lista').innerHTML='<div class="status">Sem liga\u00E7\u00E3o. Tenta de novo.</div>'; });
}
byId('btnSave').onclick=function(){
  if(!BACKEND){ alert('Sem liga\u00E7\u00E3o \u00E0 nuvem.'); return; }
  var msg=byId('msg').value.trim();
  if(!msg){ alert('Escreve a mensagem da notifica\u00E7\u00E3o.'); return; }
  if(!sel.size){ alert('Escolhe pelo menos um dia.'); return; }
  var cfg={msg:msg, dias:Array.from(sel), ate:(byId('ate').value||'')};
  var btn=this; btn.disabled=true;
  fetch(BACKEND,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'nota_add',seccao:SEC,autor:'',texto:JSON.stringify(cfg)})})
    .then(function(r){return r.json();}).then(function(j){
      if(j&&j.ok){ byId('msg').value=''; byId('ate').value=''; sel.clear(); paintDays(); toast('Notifica\u00E7\u00E3o criada \u2713'); setTimeout(carregar,500); }
      else throw new Error();
    }).catch(function(){ alert('N\u00E3o foi poss\u00EDvel criar. Tenta de novo.'); })
    .then(function(){ btn.disabled=false; });
};
function toggle(n,off){
  fetch(BACKEND,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'nota_done',id:n.id,done:off})})
    .then(function(r){return r.json();}).then(function(){ n.done=off; render(); toast(off?'Notifica\u00E7\u00E3o desativada':'Notifica\u00E7\u00E3o ativada'); }).catch(function(){ alert('Falhou. Tenta de novo.'); });
}
function del(n){
  fetch(BACKEND,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'nota_del',id:n.id})})
    .then(function(r){return r.json();}).then(function(){ NOTIFS=NOTIFS.filter(function(x){return String(x.id)!==String(n.id);}); render(); toast('Notifica\u00E7\u00E3o apagada'); }).catch(function(){ alert('Falhou. Tenta de novo.'); });
}
carregar();
</script>
</body>
</html>
