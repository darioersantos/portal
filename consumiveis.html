<title>Consumiveis em Falta &middot; Sport Zone Vasco da Gama</title>
<script>if(sessionStorage.getItem('portalOK')!=='1')location.replace('index.html');</script>
<script src="config.js"></script>
<script src="lucide.js"></script>
<script src="roster.js"></script>
<style>
  :root{
    --bg:#f6f5f3;--card:#ffffff;--ink:#1a1303;--muted:#7c7264;--line:#ece7df;
    --accent:#FF8100;--accent-dark:#E06E00;--accent-soft:#ffe7cf;--accent-ink:#8a4500;
    --neg:#dc2626;--pos:#15803d;--shadow:0 1px 2px rgba(26,19,3,.06),0 4px 16px rgba(26,19,3,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;overscroll-behavior:none;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;padding-bottom:40px;-webkit-text-size-adjust:100%;}

  header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#FF8100,#E66200);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;box-shadow:0 2px 12px rgba(230,98,0,.28);}
  .h-top{display:flex;align-items:center;gap:12px;justify-content:space-between;max-width:880px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:11px;min-width:0;}
  .logo{width:50px;height:50px;border-radius:12px;flex:none;background:#fff;padding:4px;box-shadow:0 2px 9px rgba(0,0,0,.2);cursor:pointer;}
  .logo img{width:100%;height:100%;border-radius:8px;display:block;object-fit:cover;}
  .brand h1{font-size:17px;margin:0;font-weight:800;line-height:1.1;display:flex;align-items:center;gap:8px;}
  .brand p{font-size:12px;margin:2px 0 0;color:#fff;font-weight:600;}
  .hbadge{background:#fff;color:#E06E00;border-radius:999px;font-size:12px;font-weight:800;padding:1px 8px;}
  .icon-btn{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:10px;padding:9px 12px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;}

  main{max-width:760px;margin:0 auto;padding:14px 12px 24px;}

  .add-card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin:6px 0 14px;}
  .add-card h2{font-size:15px;margin:0 0 12px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;}
  .field input,.field select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .row2{display:flex;gap:10px;} .row2 .field{flex:1;min-width:0;}
  .quick{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 12px;}
  .quick b{width:100%;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:1px;}
  .qchip{background:#fff;border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:all .12s;}
  .qchip:active{transform:scale(.95);} .qchip:hover{border-color:var(--accent);background:var(--accent-soft);}
  .qchip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .qchip.on:hover{background:var(--accent-dark);border-color:var(--accent-dark);}
  .qchip.outros{border-style:dashed;color:var(--accent-dark);font-weight:700;}
  .qchip .rmx{font-weight:800;margin-left:3px;opacity:.9;}
  .addbtn{width:100%;margin-top:2px;background:var(--accent);color:#fff;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 4px 16px rgba(230,98,0,.3);transition:transform .12s,box-shadow .12s;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;}
  .addbtn:active{transform:scale(.98);box-shadow:0 2px 8px rgba(230,98,0,.3);}
  .addbtn[disabled]{opacity:.6;}

  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 2px 12px;}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;}
  .chip.falta{background:#fff1e6;color:#b45309;}
  .chip.enc{background:#e8f5ee;color:#15803d;}
  .copybtn{margin-left:auto;background:#fff;border:1.5px solid var(--line);color:var(--ink);border-radius:11px;padding:8px 13px;font-size:13.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-family:inherit;}
  .copybtn:active{transform:scale(.97);} .copybtn:hover{border-color:var(--accent);}

  .grp{margin:14px 0;}
  .grp-h{font-size:13px;font-weight:800;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.04em;margin:0 2px 8px;display:flex;align-items:center;gap:8px;}
  .grp-h .c{background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:1px 9px;font-size:12px;}

  .item{background:var(--card);border:1px solid var(--line);border-left:4px solid #eab308;border-radius:14px;box-shadow:var(--shadow);padding:13px 14px;margin-bottom:10px;animation:pop .28s ease both;}
  @keyframes pop{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}
  .item .nome{font-size:16px;font-weight:700;line-height:1.3;word-break:break-word;}
  .st{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:800;margin-bottom:8px;}
  .st.pend{background:#fef9c3;color:#a16207;}
  .st.enc{background:#dcfce7;color:#15803d;}
  .item.enc{border-left-color:var(--pos);background:#fbfefb;}
  .item.enc .nome{color:var(--muted);text-decoration:line-through;}
  .qt{display:inline-flex;align-items:center;gap:5px;margin-top:7px;background:#fff1e6;color:#b45309;border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:700;}
  .item.enc .qt{background:#eef2ee;color:var(--muted);}
  .meta{font-size:12px;color:var(--muted);margin-top:9px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .acts{margin-left:auto;display:flex;gap:6px;}
  .acts button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:inherit;color:var(--ink);transition:transform .1s;}
  .acts button:active{transform:scale(.94);}
  .acts .enc-btn{background:#fff;border-color:#cbd5c0;color:var(--ink);}
  .acts .enc-btn:active{background:#f4faf6;}
  .acts .del{color:var(--neg);border-color:#f3d0d0;}

  /* Acordeao dos ja encomendados */
  .grp-acc-h{cursor:pointer;user-select:none;-webkit-user-select:none;background:#f4faf6;border:1px solid #cdeed8;border-radius:12px;padding:10px 12px;margin:0 2px;color:#15803d;}
  .acc-chev{width:0;height:0;flex:none;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:7px solid currentColor;border-right:0;}
  .grp-acc.open .grp-acc-h{margin-bottom:8px;}
  .grp-acc.open .acc-chev{border-left:5px solid transparent;border-right:5px solid transparent;border-top:7px solid currentColor;border-bottom:0;}
  .acc-body{display:none;} .grp-acc.open .acc-body{display:block;}

  .empty{text-align:center;color:var(--muted);padding:44px 16px;}
  .empty .ic{width:60px;height:60px;margin:0 auto 12px;border-radius:16px;background:var(--accent-soft);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;}
  .empty h3{margin:0 0 4px;font-size:16px;color:var(--ink);}
  .empty p{margin:0;font-size:13.5px;}
  .status{text-align:center;color:var(--muted);padding:30px;font-size:14px;}

  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1a1303;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:200;display:inline-flex;align-items:center;gap:8px;max-width:90vw;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .ov{position:fixed;inset:0;z-index:300;background:rgba(26,19,3,.5);display:none;align-items:center;justify-content:center;padding:20px;}
  .ov.open{display:flex;}
  .ov-card{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:420px;box-shadow:0 12px 40px rgba(0,0,0,.28);}
  .ov-card h3{margin:0 0 12px;font-size:16px;font-weight:800;}
  .ov-card input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);}
  .ov-card input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .ov-row{display:flex;gap:10px;margin-top:14px;}
  .ov-cancel{flex:1;background:#fff;border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
  .ov-ok{flex:1;background:linear-gradient(135deg,#FF8100,#E66200);border:none;color:#fff;border-radius:12px;padding:12px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;}
</style>

    <div class="quick" id="quick"></div>
    <div class="field"><label>Registado por</label><select id="por" data-staff data-area="sup" data-ph="Quem registou (opcional)"></select></div>
    <button class="addbtn" id="btnAdd" type="button" disabled><i data-lu="plus" data-sz="18"></i> <span id="addLbl">Adicionar &#xE0; lista</span></button>
  </div>

  <div class="bar" id="bar" style="display:none">
    <span class="chip falta" id="chFalta"><i data-lu="package" data-sz="14"></i> <span></span></span>
    <span class="chip enc" id="chEnc"><i data-lu="check" data-sz="14"></i> <span></span></span>
    <button class="copybtn" id="btnCopy" type="button"><i data-lu="copy" data-sz="15"></i> Copiar lista</button>
  </div>

  <div id="lista"><div class="status">A carregar...</div></div>
</main>

<div id="toast"></div>

<div class="ov" id="outrosOv">
  <div class="ov-card">
    <h3>Outro consum&#xED;vel</h3>
    <input id="outrosInp" type="text" placeholder="Escreve o que &#xE9; necess&#xE1;rio...">
    <div class="ov-row">
      <button class="ov-cancel" id="outrosCancel" type="button">Cancelar</button>
      <button class="ov-ok" id="outrosOk" type="button">Adicionar</button>
    </div>
  </div>
</div>

<script>
  var BACKEND=(typeof window!=='undefined'&&window.BACKEND_URL?String(window.BACKEND_URL).trim():'');
  var SEC='_consumivel';
  var ITENS=[];
  var COMUNS=['Sacos de pl\u00E1stico','Rolos de POS','Etiquetas','Fita-cola','Papel higi\u00E9nico','Toalhetes de m\u00E3os','Sab\u00E3o das m\u00E3os','Sprays de limpeza','Sacos do lixo','Cabides','Alarmes / tags'];
  var selCom={};      // consumiveis comuns selecionados: nome->true
  var selCustom=[];   // consumiveis "outros" escritos a mao
  function selecionados(){ return Object.keys(selCom).concat(selCustom); }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function isDone(n){ return n.done===true || String(n.done).toLowerCase()==='true'; }
  function parse(raw){ raw=String(raw||''); var by='',qt=''; var mB=raw.match(/^\[\[BY:([^\]]*)\]\]/); if(mB){ by=mB[1]; raw=raw.slice(mB[0].length); } var mQ=raw.match(/^\[\[QT:([^\]]*)\]\]/); if(mQ){ qt=mQ[1]; raw=raw.slice(mQ[0].length); } return {by:by, qt:qt, nome:raw}; }
  function fmtData(d){ if(!d) return ''; var x=new Date(d); if(isNaN(x)) return ''; function p(n){return(n<10?'0':'')+n;} return p(x.getDate())+'/'+p(x.getMonth()+1)+', '+p(x.getHours())+':'+p(x.getMinutes()); }
  function toast(msg){ var t=document.getElementById('toast'); t.innerHTML=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('show'); },2200); }
  function P(d){ return fetch(BACKEND,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d)}).then(function(r){return r.json();}); }

  // chips (multi-seleccao). Toca em varios; "Outros" abre janela para escrever.
  function atualizaBtn(){ var n=selecionados().length; var b=document.getElementById('btnAdd'); b.disabled=!n; document.getElementById('addLbl').textContent = n ? ('Adicionar \u00E0 lista ('+n+')') : 'Adicionar \u00E0 lista'; }
  function buildQuick(){
    var q=document.getElementById('quick'); q.innerHTML='<b>Toca no que est\u00E1 em falta (podes escolher v\u00E1rios)</b>';
    COMUNS.forEach(function(nm){
      var b=document.createElement('button'); b.type='button'; b.className='qchip'+(selCom[nm]?' on':''); b.textContent=nm;
      b.onclick=function(){ if(selCom[nm]){ delete selCom[nm]; b.classList.remove('on'); } else { selCom[nm]=true; b.classList.add('on'); } atualizaBtn(); };
      q.appendChild(b);
    });
    selCustom.forEach(function(nm,idx){
      var b=document.createElement('button'); b.type='button'; b.className='qchip on'; b.innerHTML=esc(nm)+' <span class="rmx">\u00D7</span>';
      b.onclick=function(){ selCustom.splice(idx,1); buildQuick(); atualizaBtn(); };
      q.appendChild(b);
    });
    var o=document.createElement('button'); o.type='button'; o.className='qchip outros'; o.textContent='+ Outros';
    o.onclick=abrirOutros;
    q.appendChild(o);
  }
  function abrirOutros(){ document.getElementById('outrosInp').value=''; document.getElementById('outrosOv').classList.add('open'); setTimeout(function(){ document.getElementById('outrosInp').focus(); },50); }
  function fecharOutros(){ document.getElementById('outrosOv').classList.remove('open'); }
  document.getElementById('outrosCancel').onclick=fecharOutros;
  document.getElementById('outrosOv').onclick=function(e){ if(e.target===this) fecharOutros(); };
  document.getElementById('outrosOk').onclick=function(){ var v=(document.getElementById('outrosInp').value||'').trim(); if(!v) return; v=v.charAt(0).toUpperCase()+v.slice(1); selCustom.push(v); fecharOutros(); buildQuick(); atualizaBtn(); };
  document.getElementById('outrosInp').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); document.getElementById('outrosOk').click(); } });
  buildQuick();

  function carregar(){
    if(!BACKEND){ document.getElementById('lista').innerHTML='<div class="status">Sem liga\u00E7\u00E3o \u00E0 nuvem (configura\u00E7\u00E3o em falta).</div>'; return; }
    fetch(BACKEND+'?action=notas&t='+Date.now()).then(function(r){return r.json();}).then(function(j){
      if(j && j.notas){ ITENS=j.notas.filter(function(n){return String(n.seccao)===SEC;}); render(); }
      else { document.getElementById('lista').innerHTML='<div class="status">N\u00E3o foi poss\u00EDvel carregar.</div>'; }
    }).catch(function(){ document.getElementById('lista').innerHTML='<div class="status">Sem liga\u00E7\u00E3o. Tenta novamente.</div>'; });
  }

  function cardHTML(n){
    var p=parse(n.texto), done=isDone(n);
    return '<div class="item'+(done?' enc':'')+'">'
      + '<span class="st '+(done?'enc':'pend')+'">'+(done?'<i data-lu="check" data-sz="12"></i> Encomendado':'<i data-lu="clock" data-sz="12"></i> Por encomendar')+'</span>'
      + '<div class="nome">'+esc(p.nome)+'</div>'
      + (p.qt?'<span class="qt">'+esc(p.qt)+'</span>':'')
      + '<div class="meta">'
      +   (p.by?'<span><i data-lu="user" data-sz="12"></i> '+esc(p.by)+'</span>':'')
      +   '<span><i data-lu="clock" data-sz="12"></i> '+fmtData(n.data)+'</span>'
      +   '<span class="acts">'
      +     (done
              ? '<button class="re-btn" data-act="reabrir" data-id="'+esc(n.id)+'"><i data-lu="rotate-ccw" data-sz="14"></i> Repor</button>'
              : '<button class="enc-btn" data-act="encomendar" data-id="'+esc(n.id)+'"><i data-lu="check" data-sz="14"></i> Marcar encomendado</button>')
      +     '<button class="del" data-act="apagar" data-id="'+esc(n.id)+'" title="Apagar"><i data-lu="x" data-sz="14"></i></button>'
      +   '</span>'
      + '</div></div>';
  }

  function render(){
    var l=document.getElementById('lista');
    var falta=ITENS.filter(function(n){return !isDone(n);});
    var enc=ITENS.filter(isDone);
    falta.sort(function(a,b){ return new Date(b.data)-new Date(a.data); });
    enc.sort(function(a,b){ return new Date(b.data)-new Date(a.data); });

    var html='';
    if(!ITENS.length){
      html='<div class="empty"><div class="ic"><i data-lu="check" data-sz="30"></i></div><h3>Tudo em ordem!</h3><p>N\u00E3o h\u00E1 consum\u00EDveis em falta. Regista acima o que precisa de encomendar.</p></div>';
    } else {
      if(falta.length){
        html+='<div class="grp"><div class="grp-h"><i data-lu="package" data-sz="16"></i> A encomendar <span class="c">'+falta.length+'</span></div>';
        falta.forEach(function(n){ html+=cardHTML(n); });
        html+='</div>';
      } else {
        html+='<div class="empty"><div class="ic"><i data-lu="check" data-sz="30"></i></div><h3>Nada por encomendar</h3><p>Todos os itens j\u00E1 foram encomendados.</p></div>';
      }
      if(enc.length){
        html+='<div class="grp grp-acc"><div class="grp-h grp-acc-h" id="accH"><span class="acc-chev"></span><i data-lu="check" data-sz="16"></i> J\u00E1 encomendados <span class="c">'+enc.length+'</span></div><div class="acc-body">';
        enc.forEach(function(n){ html+=cardHTML(n); });
        html+='</div></div>';
      }
    }
    l.innerHTML=html;

    // barra de resumo + badge
    var bar=document.getElementById('bar');
    if(ITENS.length){ bar.style.display='flex'; document.querySelector('#chFalta span').textContent=falta.length+(falta.length===1?' em falta':' em falta'); document.querySelector('#chEnc span').textContent=enc.length+' encomendados'; document.getElementById('btnCopy').style.display=falta.length?'inline-flex':'none'; }
    else { bar.style.display='none'; }
    var hb=document.getElementById('hdrBadge');
    if(falta.length){ hb.textContent=falta.length; hb.style.display=''; } else { hb.style.display='none'; }

    // ligacoes
    var accH=document.getElementById('accH'); if(accH) accH.onclick=function(){ accH.parentNode.classList.toggle('open'); };
    l.querySelectorAll('.acts button').forEach(function(b){ b.onclick=function(){ acao(b.dataset.act, b.dataset.id, b); }; });
    if(window.SZinitStaff) SZinitStaff();
  }

  function acao(act, id, btn){
    if(!BACKEND) return;
    if(act==='apagar'){ if(!confirm('Apagar este consum\u00EDvel da lista?')) return; }
    if(btn){ btn.disabled=true; btn.style.opacity=.5; }
    var msg = act==='encomendar' ? 'nota_done' : (act==='reabrir' ? 'nota_done' : 'nota_del');
    var payload = act==='apagar' ? {action:'nota_del', id:id} : {action:'nota_done', id:id, done:(act==='encomendar')};
    P(payload).then(function(){
      if(act==='encomendar') toast('<i data-lu="check" data-sz="15"></i> Marcado como encomendado');
      else if(act==='apagar') toast('Removido da lista');
      carregar();
    }).catch(function(){ if(btn){btn.disabled=false;btn.style.opacity=1;} toast('Falhou. Tenta novamente.'); });
  }

  function adicionar(){
    var nomes=selecionados(); if(!nomes.length) return;
    if(!BACKEND){ alert('Sem liga\u00E7\u00E3o \u00E0 nuvem.'); return; }
    var por=(document.getElementById('por').value||'').trim();
    var jaTem={}; ITENS.forEach(function(n){ if(!isDone(n)) jaTem[parse(n.texto).nome.toLowerCase()]=true; });
    var novos=[]; nomes.forEach(function(nm){ var k=nm.toLowerCase(); if(!jaTem[k] && novos.map(function(x){return x.toLowerCase();}).indexOf(k)<0) novos.push(nm); });
    var repetidos=nomes.length-novos.length;
    if(!novos.length){ toast('J\u00E1 est\u00E3o todos na lista'); return; }
    var btn=document.getElementById('btnAdd'); btn.disabled=true;
    var chain=Promise.resolve();
    novos.forEach(function(nm){ var textoFinal=(por?'[[BY:'+por+']]':'')+nm; chain=chain.then(function(){ return P({action:'nota_add', seccao:SEC, autor:por, texto:textoFinal}); }); });
    chain.then(function(){
      selCom={}; selCustom=[]; buildQuick(); atualizaBtn();
      toast('<i data-lu="check" data-sz="15"></i> '+novos.length+(novos.length===1?' consum\u00EDvel adicionado':' consum\u00EDveis adicionados')+(repetidos?(' \u2014 '+repetidos+' j\u00E1 existiam'):''));
      carregar();
    }).catch(function(){ btn.disabled=false; toast('Falhou. Tenta novamente.'); });
  }

  document.getElementById('btnAdd').addEventListener('click', adicionar);

  // Copiar lista de encomenda para a area de transferencia (para enviar por WhatsApp/email)
  document.getElementById('btnCopy').addEventListener('click', function(){
    var falta=ITENS.filter(function(n){return !isDone(n);}).sort(function(a,b){return new Date(a.data)-new Date(b.data);});
    if(!falta.length){ toast('Nada para copiar'); return; }
    var txt='Consum\u00EDveis a encomendar \u2014 Sport Zone Vasco da Gama\n';
    falta.forEach(function(n){ var p=parse(n.texto); txt+='- '+p.nome+(p.qt?' ('+p.qt+')':'')+'\n'; });
    function ok(){ toast('<i data-lu="check" data-sz="15"></i> Lista copiada'); }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok, function(){ prompt('Copia a lista:', txt); }); }
    else { prompt('Copia a lista:', txt); }
  });

  carregar();
</script>
</body>
</html>
