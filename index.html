<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Aplicacao desativada</title>
<link rel="icon" href="data:,">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
       background:#0b0b0d;color:#f0f0f0;
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
       text-align:center;overflow:hidden}
  .wrap{max-width:460px;width:100%}
  .selo{display:inline-block;max-width:100%;margin:0 auto 30px;padding:13px 20px;
        border:5px solid #d32f2f;border-radius:9px;
        color:#d32f2f;font-size:clamp(21px,6.6vw,44px);font-weight:900;
        letter-spacing:2.5px;text-transform:uppercase;line-height:1;white-space:nowrap;
        transform:rotate(-11deg);opacity:.95;
        box-shadow:0 0 0 3px rgba(211,47,47,.18), 0 8px 34px rgba(211,47,47,.22);
        text-shadow:0 2px 5px rgba(0,0,0,.35)}
  h1{font-size:20px;font-weight:700;margin-bottom:12px;color:#fff}
  p{font-size:15px;line-height:1.6;color:#a8a8ad;margin-bottom:10px}
  .nota{margin-top:26px;padding-top:18px;border-top:1px solid #26262b;
        font-size:12px;color:#6e6e75;line-height:1.5}
</style>
</head>
<body>
  <div class="wrap">
    <div class="selo">Desativada</div>
    <h1>Esta aplica&#231;&#227;o foi desativada</h1>
    <p>O <b>portal de gest&#227;o</b> da loja <b>Vasco da Gama</b> deixou de estar em funcionamento.</p>
    <p>Os dados j&#225; n&#227;o s&#227;o atualizados nem guardados.</p>
    <div class="nota">Se precisas de acesso, fala com a ger&#234;ncia da loja.</div>
  </div>
<script>
(function(){
  try{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations().then(function(rs){
        rs.forEach(function(r){ r.unregister(); });
      });
    }
    if(window.caches && caches.keys){
      caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); });
    }
    localStorage.clear();
  }catch(e){}
})();
</script>
</body>
</html>
