<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FF8100">
<title>Folha de Elogio &#xB7; Sport Zone Vasco da Gama</title>
<script>if(sessionStorage.getItem('portalOK')!=='1')location.replace('index.html');</script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f6f5f3;color:#111;-webkit-text-size-adjust:100%;}

  /* ---- Barra superior (s&#xF3; no ecr&#xE3;) ---- */
  .toolbar{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#FF8100,#E66200);color:#fff;
           padding:calc(12px + env(safe-area-inset-top)) 16px 12px;box-shadow:0 2px 12px rgba(230,98,0,.28);
           display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .tb-back{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:10px;padding:9px 13px;
           font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .tb-ttl{font-size:16px;font-weight:800;flex:1;min-width:120px;}
  .tb-ctrl{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);border-radius:12px;padding:5px 8px;}
  .tb-ctrl span{font-size:13px;font-weight:700;}
  .stp{width:34px;height:34px;border:none;border-radius:9px;background:#fff;color:#E06E00;font-size:20px;font-weight:800;
       cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;}
  #qtd{min-width:20px;text-align:center;font-size:16px;font-weight:800;}
  .tb-print{background:#fff;color:#E06E00;border:none;border-radius:11px;padding:10px 16px;font-size:15px;font-weight:800;
            cursor:pointer;display:inline-flex;align-items:center;gap:7px;box-shadow:0 3px 10px rgba(0,0,0,.15);}
  .hint{width:100%;font-size:12px;font-weight:600;opacity:.92;margin-top:2px;}

  #sheet{padding:14px;}
  .form{background:#fff;max-width:800px;margin:0 auto 22px;padding:34px 40px 30px;box-shadow:0 2px 14px rgba(26,19,3,.10);
        border:1px solid #eee;}

  .fhead{position:relative;text-align:center;padding-top:4px;}
  .logo{position:absolute;right:0;top:0;text-align:right;line-height:.86;font-weight:900;color:#111;}
  .logo .s{font-size:19px;letter-spacing:2px;font-weight:800;}
  .logo .z{font-size:24px;letter-spacing:1px;}
  .ftitle{font-size:27px;font-weight:800;letter-spacing:.5px;margin:0;line-height:1.12;text-transform:uppercase;}
  .stardiv{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0 12px;}
  .stardiv .ln{height:2px;background:#111;flex:1;max-width:230px;}
  .stardiv svg{width:16px;height:16px;fill:#111;}

  .instr{text-align:center;font-size:12px;font-weight:700;letter-spacing:.3px;margin-bottom:16px;text-transform:uppercase;}

  table.ftable{width:100%;border-collapse:collapse;margin-bottom:22px;}
  table.ftable td{border:1.5px solid #111;padding:12px 14px;vertical-align:middle;}
  table.ftable td.lbl{width:230px;font-size:14px;font-weight:800;line-height:1.35;}
  table.ftable td.lbl .en{font-weight:500;color:#333;}
  table.ftable td.val{font-size:20px;font-weight:800;letter-spacing:.5px;}
  table.ftable tr.tall td{height:52px;}

  .qrow{display:flex;align-items:center;gap:14px;margin:18px 0 8px;}
  .ico{width:46px;height:46px;border:1.6px solid #111;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;}
  .ico svg{width:23px;height:23px;stroke:#111;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .ico svg.fill{fill:#111;stroke:#111;}
  .qlab{font-size:16px;font-weight:800;}
  .qlab .en{font-weight:500;color:#333;}
  .uline{border-bottom:1.6px solid #111;height:20px;margin-top:2px;}
  .qrow .u{flex:1;}

  .dots{margin:6px 0 20px;}
  .dots .d{border-bottom:1.5px dotted #999;height:26px;}

  .frow{display:flex;align-items:flex-start;gap:0;margin:22px 0 6px;}
  .fcol{flex:1;display:flex;align-items:center;gap:12px;min-width:0;}
  .fcol .body{flex:1;min-width:0;}
  .flab{font-size:13.5px;font-weight:800;letter-spacing:.3px;}
  .dateln{font-size:20px;font-weight:800;letter-spacing:2px;margin-top:4px;}
  .vdiv{width:1.5px;background:#111;align-self:stretch;margin:0 18px;min-height:56px;}

  .priv{display:flex;align-items:flex-start;gap:14px;margin-top:8px;}
  .priv .body{flex:1;}
  .ptitle{font-size:16px;font-weight:800;margin-bottom:6px;}
  .priv p{font-size:12.5px;color:#333;margin:3px 0;line-height:1.5;}
  .priv .mail{font-weight:800;color:#111;}

  @media print{
    @page{size:A4 portrait;margin:12mm;}
    html,body{background:#fff;}
    .toolbar{display:none !important;}
    #sheet{padding:0;}
    .form{box-shadow:none;border:none;margin:0;max-width:none;padding:0;page-break-after:always;}
    .form:last-child{page-break-after:auto;}
  }
</style>
</head>
<body>

  <div class="toolbar">
    <a class="tb-back" href="index.html">&#8592; Voltar</a>
    <div class="tb-ttl">Folha de Elogio</div>
    <div class="tb-ctrl">
      <span>Folhas:</span>
      <button class="stp" id="menos" type="button" aria-label="Menos folhas">&#8722;</button>
      <span id="qtd">1</span>
      <button class="stp" id="mais" type="button" aria-label="Mais folhas">+</button>
    </div>
    <button class="tb-print" id="imprimir" type="button">&#128424;&#65039; Imprimir</button>
    <div class="hint">Cada folha imprime 1 formul&#xE1;rio de elogio em A4.</div>
  </div>

  <div id="sheet"></div>

<script>
  var POR_FOLHA = 1;
  var folhas = 1;

  var ICO = {
    user:'<circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/>',
    heart:'<path class="fp" d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',
    cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
    shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="M9.5 12.5 11 14l3.5-3.5"/>'
  };
  function svg(name, fill){
    return '<svg viewBox="0 0 24 24"'+(fill?' class="fill"':'')+'>'+ICO[name]+'</svg>';
  }

  var FORM =
    '<div class="fhead">' +
      '<div class="logo"><div class="s">SPORT</div><div class="z">ZONE</div></div>' +
      '<h1 class="ftitle">Folha de Elogio<br>Customer Compliment Form</h1>' +
    '</div>' +
    '<div class="stardiv"><span class="ln"></span>' +
      '<svg viewBox="0 0 24 24" class="fill"><polygon points="12 2 15.1 8.6 22 9.3 17 14.1 18.2 21 12 17.8 5.8 21 7 14.1 2 9.3 8.9 8.6 12 2"/></svg>' +
      '<span class="ln"></span></div>' +
    '<div class="instr">Use caneta esferogr\u00E1fica e escreva em mai\u00FAsculas / Use a ball-point and write in capital letters</div>' +
    '<table class="ftable">' +
      '<tr class="tall"><td class="lbl">Estabelecimento|Servi\u00E7o<br><span class="en">Establishment|Service</span></td><td class="val">SPORT ZONE VASCO DA GAMA</td></tr>' +
      '<tr class="tall"><td class="lbl">Nome do Elogiante<br><span class="en">Name</span></td><td></td></tr>' +
      '<tr class="tall"><td class="lbl">Email</td><td></td></tr>' +
    '</table>' +
    '<div class="qrow"><div class="ico">' + svg('user') + '</div>' +
      '<div class="qlab">Quem quero elogiar <span class="en">/ Who I want to praise</span></div></div>' +
    '<div class="uline"></div>' +
    '<div class="qrow"><div class="ico">' + svg('heart', true) + '</div>' +
      '<div class="qlab">Motivo do Elogio <span class="en">/ Reason for praise</span></div></div>' +
    '<div class="dots"><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div></div>' +
    '<div class="frow">' +
      '<div class="fcol"><div class="ico">' + svg('cal') + '</div><div class="body"><div class="flab">DATA | DATE</div><div class="dateln">___ / ___ / ______</div></div></div>' +
      '<div class="vdiv"></div>' +
      '<div class="fcol"><div class="ico">' + svg('pen') + '</div><div class="body"><div class="flab">ASSINATURA DO ELOGIANTE | SIGNATURE</div><div class="uline"></div></div></div>' +
    '</div>' +
    '<div class="stardiv"><span class="ln"></span>' +
      '<svg viewBox="0 0 24 24" class="fill"><polygon points="12 2 15.1 8.6 22 9.3 17 14.1 18.2 21 12 17.8 5.8 21 7 14.1 2 9.3 8.9 8.6 12 2"/></svg>' +
      '<span class="ln"></span></div>' +
    '<div class="priv"><div class="ico">' + svg('shield') + '</div><div class="body">' +
      '<div class="ptitle">Pol\u00EDtica de privacidade</div>' +
      '<p>Sprinter Megacentros del Desporto S.L.</p>' +
      '<p>Usamos os seus dados apenas para melhorar a sua experi\u00EAncia na Sport Zone/Sprinter/JD.</p>' +
      '<p>Se tem alguma quest\u00E3o sobre a forma como protegemos a sua privacidade, pode contactar-nos atrav\u00E9s do e-mail:</p>' +
      '<p class="mail">protecciondatos@sprintersports.com</p>' +
    '</div></div>';

  function construir(){
    var host = document.getElementById('sheet');
    host.innerHTML = '';
    for(var p=0; p<folhas; p++){
      var page = document.createElement('div');
      page.className = 'form';
      page.innerHTML = FORM;
      host.appendChild(page);
    }
    document.getElementById('qtd').textContent = folhas;
  }

  document.getElementById('mais').addEventListener('click', function(){ if(folhas < 20){ folhas++; construir(); } });
  document.getElementById('menos').addEventListener('click', function(){ if(folhas > 1){ folhas--; construir(); } });
  document.getElementById('imprimir').addEventListener('click', function(){ window.print(); });

  construir();
</script>
</body>
</html>
