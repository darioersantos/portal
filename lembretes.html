<style>
  :root{
    --bg:#f6f5f3;--card:#ffffff;--ink:#1a1303;--muted:#7c7264;--line:#ece7df;
    --accent:#FF8100;--accent-dark:#E06E00;--accent-soft:#ffe7cf;--accent-ink:#8a4500;
    --neg:#dc2626;--red:#e11d2b;--pos:#15803d;--shadow:0 1px 2px rgba(26,19,3,.06),0 4px 16px rgba(26,19,3,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;overscroll-behavior:none;touch-action:pan-y;}
  body{overflow-x:clip;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;padding-bottom:40px;-webkit-text-size-adjust:100%;}

  header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#FF8100,#E66200);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;box-shadow:0 2px 12px rgba(230,98,0,.28);}
  .h-top{display:flex;align-items:center;gap:12px;justify-content:space-between;max-width:880px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:11px;min-width:0;}
  .logo{width:50px;height:50px;border-radius:12px;flex:none;background:#fff;padding:4px;box-shadow:0 2px 9px rgba(0,0,0,.2);}
  .logo img{width:100%;height:100%;border-radius:8px;display:block;object-fit:cover;}
  .brand h1{font-size:17px;margin:0;font-weight:800;line-height:1.1;display:flex;align-items:center;gap:7px;}
  .brand p{font-size:12px;margin:2px 0 0;color:#fff;font-weight:600;}
  .icon-btn{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:10px;padding:8px 12px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;}
  .hbadge{display:inline-flex;align-items:center;justify-content:center;min-width:21px;height:21px;padding:0 5px;background:var(--red);color:#fff;border-radius:999px;font-size:12px;font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.25);}

  main{max-width:880px;margin:0 auto;padding:12px 12px 20px;}

  .add{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin:4px 0 16px;}
  .add textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);min-height:110px;resize:vertical;}
  .add textarea:focus{outline:none;border-color:var(--accent);}
  .add .row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;align-items:center;}
  .add input[type=text]{flex:1;min-width:150px;border:1.5px solid var(--line);border-radius:12px;padding:11px;font-size:15px;font-family:inherit;background:#fff;}
  .add select{border:1.5px solid var(--line);border-radius:12px;padding:11px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);}
  .add #autor{flex:1;min-width:150px;}
  .add input:focus,.add select:focus{outline:none;border-color:var(--accent);}
  .add button{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;}
  .add button:disabled{opacity:.6;}
  .add .sec-btn{background:#fff;border:1.5px solid var(--line);color:var(--accent-dark);}
  .add .icon-only{padding:11px 13px;display:inline-flex;align-items:center;justify-content:center;}
  .add .icon-only svg{width:18px;height:18px;}
  .add #btnMic .micsvg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;}
  .add #btnMic.rec{background:var(--neg);border-color:var(--neg);color:#fff;animation:micpulse 1s infinite;}
  @keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.5);}50%{box-shadow:0 0 0 6px rgba(220,38,38,0);}}
  .note .editar{background:#fff;border:1.5px solid var(--line);color:var(--accent-dark);border-radius:9px;padding:7px 10px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;}
  .note .edit-box{margin-top:9px;}
  .note .edit-box textarea{width:100%;border:1.5px solid var(--accent);border-radius:10px;padding:9px;font-size:15px;font-family:inherit;min-height:60px;resize:vertical;background:#fff;}
  .note .edit-box select{width:100%;margin-top:7px;border:1.5px solid var(--line);border-radius:10px;padding:9px;font-size:14px;font-family:inherit;background:#fff;}
  .note .edit-row{display:flex;gap:8px;margin-top:7px;}
  .note .edit-row button{border:none;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;}
  .note .ed-save{background:var(--accent);color:#fff;}
  .note .ed-cancel{background:#fff;border:1.5px solid var(--line);color:var(--muted);}
  #fotoPrev{margin-top:11px;display:none;align-items:center;gap:10px;}
  #fotoPrev img{width:80px;height:80px;object-fit:cover;border-radius:10px;border:1px solid var(--line);}
  #fotoPrev button{background:#fff;border:1.5px solid var(--line);color:var(--neg);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}

  .grp{margin:18px 0;}
  .grp-h{font-size:13px;font-weight:800;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.04em;margin:0 2px 8px;display:flex;align-items:center;gap:8px;}
  .grp-h .grp-c{background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:1px 9px;font-size:12px;}
  /* Acordeao das tarefas agendadas */
  .grp-acc-h{cursor:pointer;user-select:none;-webkit-user-select:none;background:#faf5ff;border:1px solid #e9d5ff;border-radius:12px;padding:10px 12px;margin:0 2px;color:#7e22ce;}
  .acc-chev{width:0;height:0;flex:none;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:7px solid currentColor;border-right:0;}
  .grp-acc.open .grp-acc-h{margin-bottom:8px;}
  .grp-acc.open .acc-chev{border-left:5px solid transparent;border-right:5px solid transparent;border-top:7px solid currentColor;border-bottom:0;}
  .acc-body{display:none;}
  .grp-acc.open .acc-body{display:block;}

  .note{position:relative;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:14px;box-shadow:var(--shadow);padding:13px 15px;margin:10px 0;}
  .note .txt{font-size:15px;white-space:pre-wrap;word-break:break-word;}
  .note .thumb{display:block;margin-top:9px;width:100%;max-width:240px;height:auto;border-radius:10px;cursor:zoom-in;border:1px solid var(--line);}
  .note .meta{display:flex;align-items:center;gap:10px;margin-top:11px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
  .note .meta b{color:var(--accent-dark);}
  .note .acts{margin-left:auto;display:flex;gap:6px;}
  .note .concluir{background:var(--pos);color:#fff;border:none;border-radius:9px;padding:7px 12px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;}
  .note .del{background:none;border:none;color:var(--neg);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
  .note.done{background:#f4f6f4;border-left-color:#bcc7bc;opacity:.85;}
  .note.done .txt{text-decoration:line-through;color:var(--muted);}
  .note.done .concluir{background:#fff;color:var(--muted);border:1.5px solid var(--line);}
  .feito{display:inline-block;background:#dcfce7;color:var(--pos);font-size:10px;font-weight:800;border-radius:999px;padding:2px 9px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:7px;}

  /* tarefa PRIORITÁRIA: cartão com outra cor */
  .note.prio{background:#fff1ef;border-color:#f6c9c2;border-left-color:var(--neg);}
  .priotag{display:inline-flex;align-items:center;gap:5px;background:var(--neg);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:2px 9px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:7px;}
  .priotag .flagsvg{width:11px;height:11px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  #btnPrio .flagsvg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  #btnPrio.on{background:var(--neg);border-color:var(--neg);color:#fff;}
  .ed-prio{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--neg);margin-top:8px;cursor:pointer;}
  .ed-prio input{width:16px;height:16px;accent-color:var(--neg);}
  /* tarefa IMPORTANTE: cartão amarelo */
  .note.imp{background:#fffbeb;border-color:#fde68a;border-left-color:#eab308;}
  .note.sched{background:#faf5ff;border-color:#e9d5ff;border-left-color:#9333ea;}
  .note.prio.imp{background:#fff1ef;border-color:#f6c9c2;border-left-color:var(--neg);}
  .imptag{display:inline-flex;align-items:center;gap:5px;background:#eab308;color:#3f2d00;font-size:10px;font-weight:800;border-radius:999px;padding:2px 9px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:7px;}
  .imptag .flagsvg{width:11px;height:11px;stroke:#3f2d00;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  #btnImp .flagsvg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  #btnImp.on{background:#eab308;border-color:#eab308;color:#3f2d00;}
  .ed-imp{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:#a16207;margin-top:8px;cursor:pointer;}
  .ed-imp input{width:16px;height:16px;accent-color:#eab308;}

  .note .comentar{background:#fff;border:1.5px solid var(--line);color:var(--accent-dark);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;}
  .note .coments{margin-top:8px;}
  .note .com{background:#faf7f2;border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin-top:6px;}
  .note .com-t{display:block;font-size:13px;white-space:pre-wrap;word-break:break-word;}
  .note .com-m{display:block;margin-top:3px;font-size:11px;color:var(--muted);}
  .note .com-del{background:none;border:none;color:var(--neg);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
  .note .cbox{margin-top:9px;}
  .note .cbox textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px;font-size:14px;font-family:inherit;min-height:46px;resize:vertical;background:#fff;}
  .note .cbox textarea:focus{outline:none;border-color:var(--accent);}
  .note .cb-row{display:flex;gap:8px;margin-top:7px;}
  .note .cb-nome{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:9px;font-size:13px;font-family:inherit;background:#fff;}
  .note .cb-nome:focus{outline:none;border-color:var(--accent);}
  .note .cb-send{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;}

  .empty{text-align:center;color:var(--muted);padding:30px 16px;font-size:14px;}
  .status{text-align:center;color:var(--muted);font-size:13px;padding:10px;}

  #lightbox{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.92);align-items:center;justify-content:center;padding:16px;cursor:zoom-out;}
  #lightbox img{max-width:100%;max-height:100%;border-radius:8px;}

  @keyframes saltita{0%,60%,100%{transform:translateY(0);}15%{transform:translateY(-6px);}30%{transform:translateY(0);}45%{transform:translateY(-3px);}}
  .hbadge{animation:saltita 1.4s ease-in-out infinite;}

  /* Impressao: lista de tarefas por fazer */
  .sch-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .sch-lbl{font-size:12.5px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:5px;}
  .sch-days{display:flex;gap:5px;flex-wrap:wrap;}
  .add .sch-chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
  .add .sch-chip.on{background:#9333ea;border-color:#9333ea;color:#fff;}
  .schtag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:#7e22ce;background:#f3e8ff;border-radius:999px;padding:2px 9px;}
  #printArea{display:none;}
  @media print{
    @page{size:A4;margin:16mm 14mm;}
    header,.add,#lista,#lightbox,.newbtn,.modal-overlay{display:none !important;}
    #printArea{display:block !important;color:#000;font-size:13px;}
    #printArea h1{font-size:18px;margin:0 0 2px;color:#000;}
    #printArea .pdia{font-size:25px;font-weight:800;color:#1a1303;margin:0 0 2px;text-transform:capitalize;}
    #printArea .psub{font-size:12px;color:#555;margin-bottom:14px;border-bottom:2px solid #FF8100;padding-bottom:8px;}
    #printArea h2{font-size:21px;margin:18px 0 6px;color:#8a4500;}
    #printArea ul{list-style:none;margin:0;padding:0;}
    #printArea li{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid #eee;page-break-inside:avoid;}
    #printArea .box{flex:none;width:14px;height:14px;border:1.5px solid #333;border-radius:3px;margin-top:1px;}
    #printArea li img.pthumb{flex:none;width:150px;height:auto;border-radius:5px;border:1px solid #bbb;margin-left:6px;}
    #printArea i{color:#555;font-style:italic;}
  }

  /* botão novo + popup de criação */
  .newbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(230,98,0,.3);margin:4px 0 16px;}
  .newbtn:active{transform:scale(.98);}
  .newbtn i{width:19px;height:19px;}
  .modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(26,19,3,.5);display:none;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 14px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .modal-overlay.open{display:flex;}
  .modal-card{background:var(--card);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.3);padding:18px;width:100%;max-width:560px;margin:auto;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;}
  .modal-head h2{margin:0;font-size:18px;font-weight:800;color:var(--accent-dark);}
  .modal-x{background:#f4efe9;border:none;color:var(--muted);border-radius:10px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
  .modal-x i{width:18px;height:18px;}
  .modal-card .add{border:none;box-shadow:none;padding:0;margin:0;background:transparent;}
  .cal-row{margin-top:10px;}
  .cal-chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--accent-dark);cursor:pointer;}
  .cal-chk input{width:18px;height:18px;flex:none;accent-color:var(--accent);}
  .cal-fields{display:flex;gap:8px;margin-top:8px;}
  .cal-fields input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:9px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);}
  .edit-box .ed-cal{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--accent-dark);margin-top:8px;cursor:pointer;}
  .edit-box .ed-cal input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);}
  .edit-box .ed-cal-fields{display:flex;gap:8px;margin-top:7px;}
  .edit-box .ed-cal-fields input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:8px;font-size:14px;font-family:inherit;background:#fff;}
  input[type=date],input[type=time]{-webkit-appearance:none;-moz-appearance:none;appearance:none;min-width:0;max-width:100%;box-sizing:border-box;}/*DATEFIX*/
</style>

<script>
"use strict";
const BACKEND=(typeof window!=='undefined'&&window.BACKEND_URL?String(window.BACKEND_URL).trim():'');
const IMGSEP='||IMG||';
const COMENTSEP='@@';
const SECS=[
  {k:'geral',     nm:'Geral',     lu:'clipboard-list'},
  {k:'calcado',   nm:'Calçado',   lu:'footprints'},
  {k:'textil',    nm:'Têxtil',    lu:'shirt'},
  {k:'visual',    nm:'Visual',    lu:'image'},
  {k:'caixa',     nm:'Caixa',     lu:'receipt'},
  {k:'logistica', nm:'Logística', lu:'package'}
];
let NOTAS=[];
let COMENTARIOS=[];
let pendingFoto='';

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtData(d){ try{ return new Date(d).toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function isDone(n){ return n.done===true || String(n.done).toLowerCase()==='true'; }
function pendentes(){ return NOTAS.filter(n=>!isDone(n)).length; }
function semBy(raw){ return String(raw||'').replace(/^\[\[BY:[^\]]*\]\]/,''); }
function parteBy(raw){ var m=String(raw||'').match(/^\[\[BY:([^\]]*)\]\]/); return m?m[1]:''; }
const PRIOMARK='[[PRIO]]';
const IMPMARK='[[IMP]]';
const WDIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function semSch(raw){ return semBy(raw).replace(/^\[\[SCH:[0-9,]*\]\]/,''); }
function parteSch(raw){ var m=semBy(raw).match(/^\[\[SCH:([0-9,]*)\]\]/); return m?m[1].split(',').filter(function(x){return x!=='';}).map(Number):[]; }
function schRawMark(raw){ var m=semBy(raw).match(/^(\[\[SCH:[0-9,]*\]\])/); return m?m[1]:''; }
function schLabel(raw){ var d=parteSch(raw); return d.length?d.map(function(x){return WDIAS[x];}).join(', '):''; }
function dueToday(raw){ var d=parteSch(raw); if(!d.length) return true; return d.indexOf(new Date().getDay())>=0; }
function temPrio(raw){ return semSch(raw).indexOf(PRIOMARK)===0; }
function temImp(raw){ var s=semSch(raw); if(s.indexOf(PRIOMARK)===0) s=s.slice(PRIOMARK.length); return s.indexOf(IMPMARK)===0; }
function parteTexto(raw){ raw=semSch(raw); if(raw.indexOf(PRIOMARK)===0) raw=raw.slice(PRIOMARK.length); if(raw.indexOf(IMPMARK)===0) raw=raw.slice(IMPMARK.length); var i=raw.indexOf(IMGSEP); return i>=0?raw.slice(0,i):raw; }
function parteFoto(raw){ raw=semBy(raw); var i=raw.indexOf(IMGSEP); return i>=0?raw.slice(i+IMGSEP.length):''; }

function preencherSeccoes(){
  const sel=document.getElementById('seccao'); sel.innerHTML='';
  SECS.forEach(function(s){ const o=document.createElement('option'); o.value=s.k; o.textContent=s.nm; sel.appendChild(o); });
}

function render(){
  const l=document.getElementById('lista'); l.innerHTML='';
  let any=false;
  SECS.forEach(function(s){
    let itens=NOTAS.filter(n=>n.seccao===s.k && (!schLabel(n.texto) || dueToday(n.texto)));
    if(!itens.length) return;
    any=true;
    itens.sort(function(a,b){ const da=isDone(a),db=isDone(b); if(da!==db) return da?1:-1; const pa=temPrio(a.texto),pb=temPrio(b.texto); if(pa!==pb) return pa?-1:1; const ia=temImp(a.texto),ib=temImp(b.texto); if(ia!==ib) return ia?-1:1; return new Date(b.data)-new Date(a.data); });
    const grp=document.createElement('div'); grp.className='grp';
    const porFazer=itens.filter(n=>!isDone(n)).length;
    grp.innerHTML='<div class="grp-h"><i data-lu="'+s.lu+'" data-sz="16"></i> '+esc(s.nm)+' <span class="grp-c">'+porFazer+' por fazer</span></div>';
    itens.forEach(function(n){ grp.appendChild(makeCard(n)); });
    l.appendChild(grp);
  });
  // Todas as tarefas agendadas ficam agrupadas num unico grupo no final da pagina
  var agend=NOTAS.filter(function(n){ return schLabel(n.texto) && !dueToday(n.texto); });
  if(agend.length){
    any=true;
    agend.sort(function(a,b){ const da=isDone(a),db=isDone(b); if(da!==db) return da?1:-1; return new Date(b.data)-new Date(a.data); });
    const grp=document.createElement('div'); grp.className='grp grp-acc';
    const porFazer=agend.filter(function(n){return !isDone(n);}).length;
    const head=document.createElement('div'); head.className='grp-h grp-acc-h';
    head.innerHTML='<span class="acc-chev"></span><i data-lu="calendar-clock" data-sz="16"></i> Agendadas <span class="grp-c">'+porFazer+' por fazer</span>';
    const body=document.createElement('div'); body.className='acc-body';
    agend.forEach(function(n){ body.appendChild(makeCard(n)); });
    head.addEventListener('click', function(){ grp.classList.toggle('open'); });
    grp.appendChild(head); grp.appendChild(body);
    l.appendChild(grp);
  }
  if(!any){ l.innerHTML='<div class="empty">Sem tarefas. Escreve a primeira acima.</div>'; }
  atualizarBadge();
  if(window.SZinitStaff) SZinitStaff();
}

function makeCard(n){
      const done=isDone(n);
      const prio=temPrio(n.texto);
      const imp=temImp(n.texto);
      const txt=parteTexto(n.texto), img=parteFoto(n.texto), criador=parteBy(n.texto);
      const coms=COMENTARIOS.filter(function(x){return x.parent===String(n.id);}).sort(function(a,b){return new Date(a.data)-new Date(b.data);});
      let comsHtml='';
      coms.forEach(function(cm){ comsHtml+='<div class="com"><span class="com-t">'+esc(cm.texto)+'</span><span class="com-m"><i data-lu="message-circle" data-sz="13"></i> '+(cm.autor?esc(cm.autor)+' · ':'')+fmtData(cm.data)+' <button class="com-del" data-id="'+esc(cm.id)+'"><i data-lu="x" data-sz="13"></i></button></span></div>'; });
      const c=document.createElement('div'); c.className='note'+(done?' done':'')+(prio&&!done?' prio':'')+(imp&&!done?' imp':'')+(schLabel(n.texto)&&!done?' sched':'');
      c.innerHTML=(done?'<span class="feito"><i data-lu="check" data-sz="14"></i> Concluído</span><br>':'')+
        (prio&&!done?'<span class="priotag"><svg class="flagsvg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg> Prioritária</span><br>':'')+
        (imp&&!done?'<span class="imptag"><svg class="flagsvg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg> Importante</span><br>':'')+
        (schLabel(n.texto)&&!done?'<span class="schtag"><i data-lu="calendar-clock" data-sz="12"></i> Agendada: '+esc(schLabel(n.texto))+'</span><br>':'')+
        (txt?'<div class="txt">'+esc(txt)+'</div>':'')+
        (img?'<img class="thumb" alt="foto">':'')+
        '<div class="meta">'+(criador?'✍️ Criada por <b>'+esc(criador)+'</b> · ':'')+(n.autor?'👤 para <b>'+esc(n.autor)+'</b> · ':'')+fmtData(n.data)+
        '<span class="acts">'+
          '<button class="concluir">'+(done?'<i data-lu="rotate-ccw" data-sz="14"></i> Reabrir':'<i data-lu="check" data-sz="14"></i> Concluir')+'</button>'+
          '<button class="comentar"><i data-lu="message-circle" data-sz="14"></i> Comentar</button>'+
          '<button class="editar" title="Editar"><i data-lu="pen-line" data-sz="14"></i></button>'+
          '<button class="del" title="Apagar"><i data-lu="x" data-sz="14"></i></button>'+
        '</span></div>'+
        '<div class="coments">'+comsHtml+'</div>'+
        '<div class="cbox" style="display:none">'+
          '<textarea class="cb-txt" placeholder="Escreve um comentário/nota..."></textarea>'+
          '<div class="cb-row"><select class="cb-nome" data-staff data-ph="O teu nome (opcional)"></select><button class="cb-send" type="button">Enviar</button></div>'+
        '</div>'+
        '<div class="edit-box" style="display:none">'+
          '<textarea class="ed-txt"></textarea>'+

        '</div>';

      };
      ebox.querySelector('.ed-cancel').onclick=function(){ ebox.style.display='none'; };
      var ecc=ebox.querySelector('.ed-cal-cb'), ecf=ebox.querySelector('.ed-cal-fields'), ecd=ebox.querySelector('.ed-cal-data');
      ecc.addEventListener('change',function(){ if(ecc.checked){ if(ecd&&!ecd.value) ecd.value=hojeISO(); ecf.style.display='flex'; } else { ecf.style.display='none'; } });
      ebox.querySelector('.ed-save').onclick=function(){ const ea=ebox.querySelector('.ed-autor'); if(ecc.checked){ if(!ecd.value){ alert('Escolhe a data para o Google Calendário.'); return; } abrirCalendario(ebox.querySelector('.ed-txt').value||'Tarefa','', ecd.value, ebox.querySelector('.ed-cal-hora').value); } salvarEdicao(n, ebox.querySelector('.ed-txt').value, ea?ea.value:'', this, ebox.querySelector('.ed-prio-cb').checked, ebox.querySelector('.ed-imp-cb').checked); };
      c.querySelector('.cb-send').onclick=function(){ enviarComentario(n.id, c.querySelector('.cb-txt').value, c.querySelector('.cb-nome').value, this); };
      c.querySelectorAll('.com-del').forEach(function(b){ b.onclick=function(){ apagarComentario(b.dataset.id); }; });

}

function carregar(){
  if(!BACKEND){ document.getElementById('lista').innerHTML='<div class="status">Sem ligação à nuvem (config em falta).</div>'; return; }
  document.getElementById('lista').innerHTML='<div class="status">A carregar…</div>';
  fetch(BACKEND+'?action=notas&t='+Date.now())
    .then(r=>r.json()).then(function(j){
      if(j&&j.ok&&Array.isArray(j.notas)){
        NOTAS=j.notas.filter(function(n){return String(n.seccao).charAt(0)!=='_';});
        COMENTARIOS=j.notas.filter(function(n){return String(n.seccao)==='_comentario';}).map(function(n){ var raw=String(n.texto||''); var i=raw.indexOf(COMENTSEP); return {id:n.id, parent:i>=0?raw.slice(0,i):'', texto:i>=0?raw.slice(i+COMENTSEP.length):raw, autor:n.autor, data:n.data}; });
        render();
      }
      else{ document.getElementById('lista').innerHTML='<div class="status">A zona de tarefas ainda não está ativa no servidor. Avisa o responsável.</div>'; }
    })
    .catch(function(){ document.getElementById('lista').innerHTML='<div class="status">Sem ligação. Verifica a internet e recarrega.</div>'; });
}

function onFoto(e){ const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return; comprimir(f, function(data){ pendingFoto=data; mostrarPrev(); }); }
document.getElementById('btnCamara').addEventListener('click',function(){ document.getElementById('fileCamara').click(); });

/* ---- Ditar por voz (microfone) ---- */
(function(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var btn=document.getElementById('btnMic');
  if(!SR||!btn){ if(btn) btn.style.display='none'; return; }
  var rec=null, ligado=false;
  btn.addEventListener('click',function(){
    if(ligado){ try{ rec.stop(); }catch(e){} return; }
    rec=new SR(); rec.lang='pt-PT'; rec.interimResults=false; rec.continuous=true;
    var ta=document.getElementById('texto');
    rec.onstart=function(){ ligado=true; btn.classList.add('rec'); };
    rec.onend=function(){ ligado=false; btn.classList.remove('rec'); };
    rec.onerror=function(){ ligado=false; btn.classList.remove('rec'); };
    rec.onresult=function(ev){
      var s=''; for(var i=ev.resultIndex;i<ev.results.length;i++){ if(ev.results[i].isFinal) s+=ev.results[i][0].transcript; }
      if(s){ ta.value=(ta.value?ta.value.replace(/\s*$/,'')+' ':'')+s.trim(); }
    };
    try{ rec.start(); }catch(e){ ligado=false; btn.classList.remove('rec'); }
  });
})();
function mostrarPrev(){
  const p=document.getElementById('fotoPrev');
  if(pendingFoto){ p.style.display='flex'; p.innerHTML='<img src="'+pendingFoto+'"><button type="button" id="fotoRem">✕ Remover foto</button>'; document.getElementById('fotoRem').onclick=function(){ pendingFoto=''; mostrarPrev(); }; }
  else { p.style.display='none'; p.innerHTML=''; }
}
function comprimir(file, cb){
  const img=new Image();
  img.onload=function(){
    const w=img.width, h=img.height;
    function gen(dim,q){ const s=Math.min(1,dim/Math.max(w,h)); const cw=Math.round(w*s),ch=Math.round(h*s); const c=document.createElement('canvas'); c.width=cw;c.height=ch; c.getContext('2d').drawImage(img,0,0,cw,ch); return c.toDataURL('image/jpeg',q); }
    let dim=900, q=0.6, data=gen(dim,q);
    while(data.length>46000 && (dim>320||q>0.35)){ if(q>0.4){ q-=0.1; } else { dim=Math.round(dim*0.85); q=0.55; } data=gen(dim,q); }
    cb(data);
  };
  img.onerror=function(){ alert('Não foi possível ler a imagem.'); };
  img.src=URL.createObjectURL(file);
}
function abrirFoto(src){ document.getElementById('lbImg').src=src; document.getElementById('lightbox').style.display='flex'; }

/* ---- Imprimir tarefas por fazer ---- */
document.getElementById('btnPrint').addEventListener('click',imprimir);
function imprimir(){
  const hoje=new Date().toLocaleDateString('pt-PT',{day:'2-digit',month:'long',year:'numeric'});
  let html='<h1>Tarefas do dia</h1><div class="pdia">'+esc(hoje)+'</div><div class="psub">Sport Zone &middot; Vasco da Gama</div>';
  let total=0;
  SECS.forEach(function(s){
    const itens=NOTAS.filter(function(n){return n.seccao===s.k && !isDone(n) && dueToday(n.texto);});
    if(!itens.length) return;
    itens.sort(function(a,b){ const pa=temPrio(a.texto),pb=temPrio(b.texto); if(pa!==pb) return pa?-1:1; const ia=temImp(a.texto),ib=temImp(b.texto); if(ia!==ib) return ia?-1:1; return new Date(a.data)-new Date(b.data); });
    html+='<h2>'+esc(s.nm)+'</h2><ul>';
    itens.forEach(function(n){
      total++;
      const t=parteTexto(n.texto).trim() || '(foto)';
      const foto=parteFoto(n.texto);
      html+='<li><span class="box"></span><span>'+(temPrio(n.texto)?'<b style="color:#dc2626">[PRIORITÁRIA]</b> ':'')+(temImp(n.texto)?'<b style="color:#a16207">[IMPORTANTE]</b> ':'')+esc(t)+(n.autor?' <i>— '+esc(n.autor)+'</i>':'')+'</span>'+(foto?'<img class="pthumb" src="'+foto+'">':'')+'</li>';
    });
    html+='</ul>';
  });
  if(!total){ html+='<p>Não há tarefas por fazer 🎉</p>'; }
  document.getElementById('printArea').innerHTML=html;
  window.print();
}

function calEmails(){ return (typeof window!=='undefined'&&window.CAL_EMAILS?String(window.CAL_EMAILS).trim():''); }
function hojeISO(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function abrirCalendario(titulo, descricao, dataISO, horaHHMM){
  if(!dataISO) return;
  var ymd=String(dataISO).replace(/-/g,'');
  var start, end, hm=String(horaHHMM||'').match(/^(\d{1,2}):(\d{2})/);
  if(hm){ var h=('0'+hm[1]).slice(-2); start=ymd+'T'+h+hm[2]+'00'; var eh=('0'+Math.min(23,(+hm[1])+1)).slice(-2); end=ymd+'T'+eh+hm[2]+'00'; }
  else { var pr=String(dataISO).split('-'); var nd=new Date(+pr[0],+pr[1]-1,+pr[2]+1); start=ymd; end=nd.getFullYear()+('0'+(nd.getMonth()+1)).slice(-2)+('0'+nd.getDate()).slice(-2); }
  var em=calEmails();
  var url='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(titulo||'Tarefa')+'&dates='+start+'/'+end+(descricao?('&details='+encodeURIComponent(descricao)):'')+(em?('&add='+encodeURIComponent(em)):'');
  window.open(url,'_blank');
}
(function(){ var cc=document.getElementById('calChk'); if(cc){ cc.addEventListener('change',function(){ var f=document.getElementById('calFields'), dd=document.getElementById('calData'); if(cc.checked){ if(dd&&!dd.value) dd.value=hojeISO(); f.style.display='flex'; } else { f.style.display='none'; } }); } })();
document.getElementById('btnAdd').addEventListener('click',function(){
  const texto=document.getElementById('texto').value.trim();
  const autor=document.getElementById('autor').value.trim();
  const criadoPor=document.getElementById('criadoPor').value.trim();
  const seccao=document.getElementById('seccao').value;
  if(!texto && !pendingFoto){ alert('Escreve a tarefa ou anexa uma foto.'); return; }
  if(!BACKEND){ alert('Sem ligação à nuvem.'); return; }
  var _calOn=document.getElementById('calChk').checked, _calData=document.getElementById('calData').value;
  if(_calOn){ if(!_calData){ alert('Escolhe a data para o Google Calendário.'); return; } abrirCalendario(texto||'Tarefa', criadoPor?('Criada por '+criadoPor):'', _calData, document.getElementById('calHora').value); }
  const textoFinal = (criadoPor ? '[[BY:'+criadoPor+']]' : '') + schMark() + (prioSel ? PRIOMARK : '') + (impSel ? IMPMARK : '') + texto + (pendingFoto ? IMGSEP+pendingFoto : '');
  const btn=this; btn.disabled=true; btn.textContent='A guardar…';
  fetch(BACKEND,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'nota_add', seccao:seccao, autor:autor, texto:textoFinal})})
    .then(r=>r.json()).then(function(j){
      if(j&&j.ok){ document.getElementById('texto').value=''; pendingFoto=''; setPrio(false); setImp(false); schSel=[]; buildSchDays(); mostrarPrev(); document.getElementById('calChk').checked=false; document.getElementById('calFields').style.display='none'; carregar(); closeModal(); }
      else throw new Error('erro');
    })
    .catch(function(){ alert('Não foi possível guardar. Tenta de novo.'); })
    .then(function(){ btn.disabled=false; btn.textContent='＋ Adicionar'; });
});

function concluir(id, done){
  const n=NOTAS.find(x=>String(x.id)===String(id)); if(!n) return;
  n.done=done; render();
  fetch(BACKEND,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'nota_done', id:id, done:done})})
    .then(r=>r.json()).then(function(j){ if(!j||!j.ok) throw new Error('erro'); })
    .catch(function(){ n.done=!done; render(); alert('Não foi possível atualizar. Tenta de novo.'); });
}

function apagar(id){
  if(!confirm('Apagar este lembrete?')) return;
  fetch(BACKEND,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'nota_del', id:id})})
    .then(r=>r.json()).then(function(){ NOTAS=NOTAS.filter(x=>String(x.id)!==String(id)); render(); })
    .catch(function(){ alert('Não foi possível apagar. Tenta de novo.'); });
}

function salvarEdicao(n, newText, newAutor, btn, prio, imp){
  newText=String(newText||'').trim();
  const criador=parteBy(n.texto), foto=parteFoto(n.texto), seccao=n.seccao;
  if(prio===undefined) prio=temPrio(n.texto);
  if(imp===undefined) imp=temImp(n.texto);
  if(!newText && !foto){ alert('A tarefa não pode ficar vazia.'); return; }
  if(!BACKEND){ alert('Sem ligação à nuvem.'); return; }
  const textoFinal=(criador?'[[BY:'+criador+']]':'')+schRawMark(n.texto)+(prio?PRIOMARK:'')+(imp?IMPMARK:'')+newText+(foto?IMGSEP+foto:'');
  const oldId=String(n.id);
  const coms=COMENTARIOS.filter(function(x){return x.parent===oldId;});
  const oldIds=NOTAS.map(function(x){return String(x.id);});
  if(btn){ btn.disabled=true; btn.textContent='A guardar…'; }
  function P(d){ return fetch(BACKEND,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d)}).then(function(r){return r.json();}); }
  P({action:'nota_add', seccao:seccao, autor:newAutor||'', texto:textoFinal})
   .then(function(){
      if(!coms.length){ return P({action:'nota_del', id:oldId}); }
      // tem comentários: localizar a nova tarefa e mover os comentários para ela
      return fetch(BACKEND+'?action=notas&t='+Date.now()).then(function(r){return r.json();}).then(function(j){
        const lista=(j&&j.notas)||[];
        const nova=lista.filter(function(x){return String(x.seccao)===seccao && String(x.texto)===textoFinal && oldIds.indexOf(String(x.id))<0;})
                        .sort(function(a,b){return new Date(b.data)-new Date(a.data);})[0];
        const newId=nova?String(nova.id):null;
        let chain=Promise.resolve();
        if(newId){ coms.forEach(function(cm){
          chain=chain.then(function(){ return P({action:'nota_add', seccao:'_comentario', autor:cm.autor||'', texto:newId+COMENTSEP+cm.texto}); })
                     .then(function(){ return P({action:'nota_del', id:cm.id}); });
        }); }
        return chain.then(function(){ return P({action:'nota_del', id:oldId}); });
      });
   })
   .then(function(){ carregar(); })
   .catch(function(){ alert('Não foi possível guardar a edição. Recarrega e tenta de novo.'); if(btn){ btn.disabled=false; btn.textContent='Guardar'; } });
}

function enviarComentario(parentId, texto, autor, btn){
  texto=String(texto||'').trim(); autor=String(autor||'').trim();
  if(!texto){ alert('Escreve um comentário.'); return; }
  if(!BACKEND){ alert('Sem ligação à nuvem.'); return; }
  if(btn){ btn.disabled=true; btn.textContent='A enviar…'; }
  fetch(BACKEND,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'nota_add', seccao:'_comentario', autor:autor, texto:String(parentId)+COMENTSEP+texto})})
    .then(r=>r.json()).then(function(j){ if(j&&j.ok){ carregar(); } else throw new Error('erro'); })
    .catch(function(){ if(btn){ btn.disabled=false; btn.textContent='Enviar'; } alert('Não foi possível enviar. Tenta de novo.'); });
}

function apagarComentario(id){
  if(!confirm('Apagar este comentário?')) return;
  fetch(BACKEND,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'nota_del', id:id})})
    .then(r=>r.json()).then(function(){ COMENTARIOS=COMENTARIOS.filter(x=>String(x.id)!==String(id)); render(); })
    .catch(function(){ alert('Não foi possível apagar.'); });
}

/* importante (bandeira amarela no popup) */

var schSel=[];
function schMark(){ return schSel.length?'[[SCH:'+schSel.slice().sort(function(a,b){return a-b;}).join(',')+']]':''; }
function buildSchDays(){
  var box=document.getElementById('schDays'); if(!box) return; box.innerHTML='';
  [1,2,3,4,5,6,0].forEach(function(d){
    var b=document.createElement('button'); b.type='button'; b.className='sch-chip'+(schSel.indexOf(d)>=0?' on':''); b.textContent=WDIAS[d];
    b.onclick=function(){ var i=schSel.indexOf(d); if(i>=0){ schSel.splice(i,1); b.classList.remove('on'); } else { schSel.push(d); b.classList.add('on'); } };

  });
}
