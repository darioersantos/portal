<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FF8100">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SPZ Portal">
<title>Hor&#xE1;rio do Staff &middot; Sport Zone Vasco da Gama</title>
<script src="config.js"></script>
<script src="links.js"></script>
<script src="roster.js"></script>
<script src="nav.js"></script>
<script>if((sessionStorage.getItem('sz_user')||'').trim()===''){ location.replace('dashboard.html'); }</script>
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --ink:#1b1f24; --muted:#8b929c; --muted2:#aeb4bd;
    --line:#edeff2; --line2:#e4e7ec;
    --accent:#FF8100; --accent-dark:#E06E00; --accent-soft:#fff2e5; --accent-ink:#9a4d00;
    --red:#E2231A; --green:#17b26a; --dark:#1a1d21;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 20px rgba(16,24,40,.05);
    --shadow-sm:0 1px 2px rgba(16,24,40,.05);
    --sb:270px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  svg{display:block;}
  .ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;}

  /* ===== Login overlay ===== */
  #login{position:fixed;inset:0;z-index:100;background:linear-gradient(150deg,#FF8100,#E05500);display:flex;align-items:center;justify-content:center;padding:20px;}
  #login .box{background:#fff;border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.28);padding:34px 30px;width:100%;max-width:400px;text-align:center;}
  #login .lg{width:74px;height:74px;border-radius:20px;margin:0 auto 16px;box-shadow:0 8px 20px rgba(230,98,0,.25);display:block;object-fit:contain;background:#fff;padding:6px;}
  #login h1{font-size:21px;font-weight:800;margin:0 0 4px;}
  #login p{font-size:13.5px;color:var(--muted);margin:0 0 22px;}
  #login label{display:block;text-align:left;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 6px;}
  #login select{width:100%;border:1.5px solid var(--line2);border-radius:13px;padding:13px 14px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none;min-height:52px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%238b929c' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' viewBox='0 0 24 24'><path d='m6 9 6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 14px center;}
  #login select:focus{outline:none;border-color:var(--accent);}
  #login button{width:100%;margin-top:16px;background:linear-gradient(135deg,#FF8100,#E06E00);color:#fff;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 8px 20px rgba(230,98,0,.3);}
  #login button:disabled{opacity:.6;}
  #login .err{color:var(--red);font-size:12.5px;font-weight:700;margin-top:10px;min-height:16px;}
  .app-hidden{display:none !important;}

  /* ===== Sidebar ===== */
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sb);background:var(--card);border-right:1px solid var(--line2);display:flex;flex-direction:column;z-index:40;}
  .sb-brand{padding:calc(16px + env(safe-area-inset-top)) 18px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line);}
  .sb-brand img{width:44px;height:44px;border-radius:11px;object-fit:contain;background:#fff;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .sb-brand .bt{line-height:1.1;}
  .sb-brand .bt b{display:block;font-size:14.5px;font-weight:800;}
  .sb-brand .bt span{font-size:11.5px;color:var(--muted);font-weight:600;}
  .sb-nav{flex:1;overflow-y:auto;padding:6px 12px 16px;}
  .sb-nav::-webkit-scrollbar{width:7px;} .sb-nav::-webkit-scrollbar-thumb{background:#e3e6ea;border-radius:8px;}
  .sb-grouplbl{font-size:10.5px;font-weight:800;letter-spacing:.09em;color:var(--muted2);text-transform:uppercase;padding:15px 12px 6px;}
  .sb-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:11px;color:#4a515b;font-size:13.5px;font-weight:600;cursor:pointer;position:relative;margin:1px 0;transition:background .12s,color .12s;}
  .sb-item:hover{background:#f6f7f9;color:var(--ink);}
  .sb-item .ico{width:18px;height:18px;color:#98a0ab;transition:color .12s;}
  .sb-item:hover .ico{color:#6b7280;}
  .sb-item .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sb-item .badge{background:var(--accent-soft);color:var(--accent-dark);font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;min-width:22px;text-align:center;}
  .sb-item.active{background:var(--accent-soft);color:var(--accent-dark);}
  .sb-item.active .ico{color:var(--accent);}
  .sb-item.active::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);}
  .sb-item.soon{opacity:.5;}
  /* Superliga destacado a preto */
  .sb-item.dark{background:var(--dark);color:#fff;margin:5px 0;box-shadow:0 4px 12px rgba(26,29,33,.25);}
  .sb-item.dark:hover{background:#000;color:#fff;}
  .sb-item.dark .ico{color:#ffb45e;}
  .sb-item.accent{background:linear-gradient(135deg,#FF8100,#E06E00);color:#fff;margin:5px 0;box-shadow:0 4px 12px rgba(230,98,0,.28);}
  .sb-item.accent:hover{background:linear-gradient(135deg,#ff8f1f,#f07600);color:#fff;}
  .sb-item.accent .ico{color:#fff;}
  .sb-item.accent.active::before{display:none;}
  .sb-item.accent2{background:linear-gradient(135deg,#12b76a,#0e8f54);color:#fff;margin:5px 0;box-shadow:0 4px 12px rgba(14,143,84,.28);}
  .sb-item.accent2:hover{background:linear-gradient(135deg,#17c274,#0fa05f);color:#fff;}
  .sb-item.accent2 .ico{color:#fff;}
  .sb-item.accent2.active::before{display:none;}
  .sb-user{border-top:1px solid var(--line2);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:11px;cursor:pointer;}
  .sb-user:hover{background:#f8f9fa;}
  .sb-ava{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#FF8100,#E06E00);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none;}
  .sb-user .u-name{font-size:13.5px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
  .sb-user .u-role{font-size:12px;color:var(--muted);}
  .sb-user .lo{width:17px;height:17px;color:var(--muted2);margin-left:auto;}
  .sb-user:hover .lo{color:var(--red);}

  /* ===== Main ===== */
  .main{margin-left:var(--sb);min-height:100vh;}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(244,246,248,.82);backdrop-filter:saturate(140%) blur(8px);-webkit-backdrop-filter:saturate(140%) blur(8px);padding:calc(20px + env(safe-area-inset-top)) calc(28px + env(safe-area-inset-right)) 14px calc(28px + env(safe-area-inset-left));display:flex;align-items:center;gap:16px;}
  .tb-hi h1{font-size:23px;font-weight:800;margin:0;letter-spacing:-.01em;}
  .tb-hi p{margin:2px 0 0;font-size:13.5px;color:var(--muted);}
  .tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .tb-date{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line2);border-radius:11px;padding:8px 13px;font-size:13px;font-weight:600;color:#4a515b;box-shadow:var(--shadow-sm);}
  .tb-date .ico{width:16px;height:16px;color:var(--muted);}
  .tb-icon{width:42px;height:42px;border-radius:11px;background:var(--card);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:#4a515b;cursor:pointer;position:relative;box-shadow:var(--shadow-sm);}
  .tb-icon:hover{color:var(--accent);border-color:#f0d6bd;}
  .tb-icon.add{background:linear-gradient(135deg,#FF8100,#E06E00);border:none;color:#fff;box-shadow:0 6px 16px rgba(230,98,0,.28);}
  .tb-icon.add:hover{color:#fff;filter:brightness(1.06);}
  .tb-icon.add .ico{width:22px;height:22px;stroke-width:2.4;}
  .tb-icon .dot{position:absolute;top:-4px;right:-4px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg);}

  .content{padding:8px 28px 34px;max-width:1400px;}

  /* KPI cards */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:20px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);display:flex;align-items:flex-start;gap:15px;}
  .kpi .k-ic{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#FF8100,#E96A00);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 6px 15px rgba(230,98,0,.28);}
  .kpi .k-ic .ico{width:25px;height:25px;stroke-width:2;}
  .kpi .k-lbl{font-size:13px;color:var(--muted);font-weight:600;}
  .kpi .k-val{font-size:29px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:3px 0 3px;}
  .kpi .k-sub{font-size:12.5px;font-weight:700;}
  .kpi .k-sub.a{color:var(--accent-dark);} .kpi .k-sub.g{color:var(--green);} .kpi .k-sub.m{color:var(--muted);}
  .kpi .k-sub.link{cursor:pointer;} .kpi .k-sub.link:hover{text-decoration:underline;}

  /* layout grid */
  .layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(320px,1fr);gap:18px;align-items:start;}
  .col-l{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:18px;align-items:start;}
  .col-r{display:flex;flex-direction:column;gap:18px;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px 20px;}
  .p-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .p-head h2{font-size:15.5px;font-weight:800;margin:0;}
  .p-head .cnt{background:var(--accent-soft);color:var(--accent-dark);font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;}
  .p-head .more{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:3px;}
  .p-head .more:hover{color:var(--accent-dark);}
  .p-head .more .ico{width:14px;height:14px;}

  .rows{margin-top:8px;}
  .trow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);}
  .trow:last-child{border-bottom:none;}
  .trow .stat{width:9px;height:9px;border-radius:999px;flex:none;background:var(--muted2);}
  .trow .stat.urg{background:var(--red);} .trow .stat.hoje{background:var(--accent);}
  .trow .t-txt{flex:1;min-width:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .trow .t-tag{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:2px 8px;border-radius:999px;flex:none;}
  .t-tag.urg{background:#fdecec;color:var(--red);} .t-tag.hoje{background:var(--accent-soft);color:var(--accent-dark);}

  .lrow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);}
  .lrow:last-child{border-bottom:none;}
  .lrow .l-ic{width:34px;height:34px;border-radius:10px;background:#f4f6f8;color:#6b7280;display:flex;align-items:center;justify-content:center;flex:none;}
  .lrow .l-ic.cake{background:var(--accent-soft);color:var(--accent-dark);}
  .lrow .l-ic .ico{width:17px;height:17px;}
  .lrow .l-info{flex:1;min-width:0;}
  .lrow .l-txt{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lrow .l-meta{font-size:12px;color:var(--muted);}
  .lrow .l-when{font-size:12px;color:var(--muted2);font-weight:700;flex:none;text-align:right;}
  .lrow .l-when.hoje{color:var(--accent-dark);}
  .empty{padding:22px 6px;text-align:center;color:var(--muted2);font-size:13px;}

  .ghostbtn{width:100%;margin-top:12px;padding:10px;border:1px solid var(--line2);background:#fafbfc;border-radius:11px;font-size:13px;font-weight:700;color:#4a515b;cursor:pointer;font-family:inherit;}
  .ghostbtn:hover{border-color:#f0d6bd;color:var(--accent-dark);background:var(--accent-soft);}

  /* ===== Birthday popup ===== */
  #bdpop{position:fixed;inset:0;z-index:80;background:rgba(20,24,30,.5);display:none;align-items:center;justify-content:center;padding:20px;}
  #bdpop.show{display:flex;}
  #bdpop .bx{background:#fff;border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:400px;overflow:hidden;}
  #bdpop .bh{background:linear-gradient(135deg,#FF8100,#E06E00);color:#fff;padding:22px 22px 18px;text-align:center;position:relative;}
  #bdpop .bh .cakeic{width:46px;height:46px;margin:0 auto 8px;}
  #bdpop .bh .cakeic .ico{width:46px;height:46px;stroke:#fff;stroke-width:1.7;}
  #bdpop .bh h3{margin:0;font-size:19px;font-weight:800;}
  #bdpop .bh p{margin:3px 0 0;font-size:13px;opacity:.92;}
  #bdpop .bx .close{position:absolute;top:12px;right:14px;color:#fff;font-size:22px;cursor:pointer;line-height:1;opacity:.85;}
  #bdpop .bb{padding:12px 20px 8px;max-height:52vh;overflow-y:auto;}
  #bdpop .bfoot{padding:8px 20px 20px;}
  #bdpop .bfoot button{width:100%;padding:12px;border:none;border-radius:13px;background:var(--accent-soft);color:var(--accent-dark);font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;}

  @media(max-width:1120px){
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr));}
    .layout{grid-template-columns:minmax(0,1fr);}
    .col-l{grid-template-columns:minmax(0,1fr);}
  }
  @media(max-width:820px){
    :root{--sb:0px;}
    .sidebar{transform:translateX(-100%);transition:transform .2s;box-shadow:0 10px 40px rgba(0,0,0,.2);width:270px;}
    .sidebar.open{transform:none;}
    .main{margin-left:0;min-width:0;}
    .menu-btn{display:flex !important;}
    .content{padding:6px calc(14px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));}
    .topbar{padding:calc(26px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 12px calc(14px + env(safe-area-inset-left));gap:11px;flex-wrap:wrap;}
    .tb-hi{min-width:0;}
    .tb-hi h1{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .tb-hi p{display:none;}
    .tb-right{gap:8px;}
    .kpis{grid-template-columns:1fr;}
  }
  /* App instalada (PWA/standalone): topo sempre abaixo da barra de estado e tocavel */
  @media all and (display-mode:standalone){
    .topbar{padding-top:calc(max(env(safe-area-inset-top),44px) + 16px);background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;}
    .sb-brand{padding-top:calc(max(env(safe-area-inset-top),44px) + 8px);}
  }
  @media all and (display-mode:fullscreen){
    .topbar{padding-top:calc(max(env(safe-area-inset-top),44px) + 16px);background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;}
    .sb-brand{padding-top:calc(max(env(safe-area-inset-top),44px) + 8px);}
  }
  .menu-btn{display:none;width:42px;height:42px;border-radius:11px;background:var(--card);border:1px solid var(--line2);align-items:center;justify-content:center;color:#4a515b;cursor:pointer;}
  .sb-backdrop{position:fixed;inset:0;background:rgba(20,24,30,.4);z-index:39;display:none;}
  .sb-backdrop.show{display:block;}



  /* ===== Componentes partilhados ===== */
  .tk-newbtn{background:linear-gradient(135deg,#FF8100,#E06E00);color:#fff;border:none;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px;box-shadow:0 6px 16px rgba(230,98,0,.28);white-space:nowrap;}
  .tk-newbtn .ico{width:18px;height:18px;stroke-width:2.4;}
  .tk-empty{font-size:12.5px;color:var(--muted2);padding:8px 2px;}


































































  .eq-bar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:10px 12px;margin-bottom:14px;box-shadow:0 2px 8px rgba(20,24,30,.04);}
  .eq-bar .nav{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--line2);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex:none;}
  .eq-bar .nav .ico{width:18px;height:18px;}
  .eq-bar input[type=date]{flex:1;min-width:0;border:1.5px solid var(--line2);border-radius:11px;padding:10px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);}
  .eq-bar .today{border:none;background:var(--accent-soft);color:var(--accent-dark);border-radius:11px;padding:10px 14px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit;flex:none;}
  .eq-dow{font-size:13px;font-weight:700;color:var(--muted2);margin:0 2px 12px;}
  .eq-dow b{color:var(--accent-dark);}
  .eq-file{font-size:12px;font-weight:700;color:var(--muted2);display:flex;align-items:center;gap:6px;margin:-6px 2px 12px;}
  .eq-file .ico{width:14px;height:14px;color:var(--accent);}
  .eq-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .eq-chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line2);background:var(--card);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:800;color:var(--ink);cursor:pointer;font-family:inherit;transition:opacity .15s;}
  .eq-chip .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .eq-chip .c{background:var(--line);border-radius:999px;padding:0 6px;font-size:11px;color:var(--muted);}
  .eq-chip.off{opacity:.42;} .eq-chip.off .dot{background:#c4c8d0 !important;}
  .eq-chip.on{border-color:#94a3b8;box-shadow:0 2px 8px rgba(20,24,30,.1);}
  .eq-clear{display:inline-flex;align-items:center;gap:5px;border:1.5px solid #f3c9c9;background:#fdecec;color:#e0413e;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;}
  .eq-clear .ico{width:13px;height:13px;}
  .eq-secdot{width:9px;height:9px;border-radius:50%;flex:none;}
  .eq-chart .xlbl.ffl{fill:#e0413e;font-weight:800;}
  .eq-cleg{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:10.5px;font-weight:700;color:var(--muted2);margin-top:8px;justify-content:center;}
  .eq-cleg .d1{width:11px;height:8px;border-radius:2px;background:#dfe6fb;display:inline-block;}
  .eq-cleg .d2{width:11px;height:4px;border-radius:2px;background:#e0413e;display:inline-block;margin-left:8px;}
  .eq-cleg .d3{width:13px;height:0;border-top:1.5px dashed #0e7490;display:inline-block;vertical-align:middle;margin-left:8px;}
  .eq-chart{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:14px 14px 10px;margin-bottom:14px;}
  .eq-chart h3{margin:0;font-size:14px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;}
  .eq-chart h3 .ico{width:16px;height:16px;color:var(--accent);}
  .eq-chart .sub{font-size:12px;color:var(--muted2);margin:2px 0 8px;}
  .eq-chart svg{width:100%;max-width:560px;height:auto;display:block;margin:0 auto;}
  .eq-bar-r{fill:#dfe6fb;} .eq-bar-r.peak{fill:var(--accent);}
  .eq-chart .xlbl{font-size:7px;fill:var(--muted2);} .eq-chart .vlbl{font-size:8px;font-weight:800;fill:var(--muted);}
  .eq-add{width:100%;border:1.5px dashed #c9b79a;background:#fff;border-radius:14px;padding:12px;font-size:14px;font-weight:800;color:var(--accent-dark);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px;}
  .eq-add .ico{width:17px;height:17px;}
  .eq-sec{margin-bottom:16px;}
  .eq-sh{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:800;color:var(--accent-ink);background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin-bottom:8px;}
  .eq-sh .cnt{margin-left:auto;background:#fff;color:var(--accent-dark);border-radius:999px;padding:1px 10px;font-size:12px;}
  .eq-ruler{position:relative;height:15px;margin:0 0 7px;}
  .eq-ruler span{position:absolute;transform:translateX(-50%);font-size:8.5px;font-weight:700;color:var(--muted2);white-space:nowrap;top:0;}
  .eq-list{display:flex;flex-direction:column;gap:11px;}
  .eq-prow{}
  .eq-pname{display:flex;align-items:center;gap:9px;margin-bottom:4px;}
  .eq-av{width:28px;height:28px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;overflow:hidden;cursor:pointer;position:relative;}
  .eq-av img{width:100%;height:100%;object-fit:cover;}
  .eq-av .cam{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.4);border-radius:8px;}
  .eq-av:active .cam{display:flex;} .eq-av .cam .ico{width:12px;height:12px;color:#fff;}
  .eq-nm{font-size:13.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
  .eq-badge{font-size:9px;font-weight:800;color:var(--accent-dark);background:var(--accent-soft);border-radius:5px;padding:0 5px;margin-left:6px;}
  .eq-prow .rm{flex:none;width:26px;height:26px;border-radius:8px;border:none;background:transparent;color:var(--muted2);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .eq-prow .rm:active{background:#fdecec;color:#e0413e;} .eq-prow .rm .ico{width:15px;height:15px;}
  .eq-track{position:relative;height:24px;border-radius:8px;overflow:hidden;}
  .eq-shift{position:absolute;top:2px;bottom:2px;border-radius:6px;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:0 7px;font-size:9.5px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.18);}
  .eq-shift .t2{opacity:.9;}
  /* Insights AI do dia (fim do ecra) */
  .eq-inswrap{margin:20px 2px 6px;}
  .eq-inswrap .ei-t{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;color:var(--ink);margin-bottom:10px;}
  .eq-inswrap .ei-t .ico{width:17px;height:17px;color:var(--accent-dark);}
  .eq-ins{border:1px solid var(--line2);border-left:3px solid var(--muted2);border-radius:12px;padding:11px 13px;background:#fff;margin-bottom:9px;box-shadow:var(--shadow-sm);}
  .eq-ins.g{border-left-color:var(--green);}
  .eq-ins.r{border-left-color:var(--red);}
  .eq-ins.i{border-left-color:var(--accent);}
  .eq-ins .ei-h{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:3px;}
  .eq-ins .ei-b{font-size:12.5px;color:#4a515b;line-height:1.6;}
  .eq-ins .ei-b b{color:var(--ink);}
  .eq-inote{font-size:11.5px;color:var(--muted2);line-height:1.5;margin-top:4px;padding:0 2px;}
  @media print{ .eq-inswrap{display:none !important;} }
  .eq-empty{text-align:center;color:var(--muted2);padding:40px 16px;font-size:14px;}
  /* animacao enquanto o horario carrega */
  .eq-spin{width:34px;height:34px;margin:0 auto 14px;border:3px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:eqspin .8s linear infinite;}
  @keyframes eqspin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){ .eq-spin{animation-duration:2.4s;} }
  .eq-empty .big{width:56px;height:56px;margin:0 auto 12px;border-radius:16px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;}
  .eq-empty .big .ico{width:28px;height:28px;color:var(--accent-dark);}
  .eq-empty .imp{margin-top:14px;border:none;background:var(--accent);color:#fff;border-radius:12px;padding:12px 20px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;}
  .eq-note{font-size:12.5px;color:var(--muted2);background:#fff8ef;border:1px solid #f3d9b5;border-radius:11px;padding:9px 12px;margin-bottom:12px;}
  .eq-tot{font-size:12.5px;color:var(--muted2);margin:0 2px 12px;}
  #eqModal{position:fixed;inset:0;z-index:150;background:rgba(20,24,30,.5);display:none;align-items:flex-end;justify-content:center;}
  #eqModal.show{display:flex;}
  #eqModal .bx{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:540px;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.2);}
  #eqModal h3{margin:0 0 6px;font-size:17px;font-weight:800;}
  #eqModal label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:11px 0 5px;}
  #eqModal input,#eqModal select{width:100%;box-sizing:border-box;border:1.5px solid var(--line2);border-radius:11px;padding:11px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);}
  #eqModal .row2{display:flex;gap:10px;} #eqModal .row2>div{flex:1;min-width:0;}
  #eqModal input[type=time]{width:100%;box-sizing:border-box;max-width:100%;}
  #eqModal .acts{display:flex;gap:10px;margin-top:17px;}
  #eqModal .acts button{flex:1;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;}
  #eqModal .acts .cancel{background:var(--line);color:var(--ink);}
  #eqModal .acts .save{background:var(--accent);color:#fff;}
  /* ---- impress&#xE3;o: 1 folha, por sec&#xE7;&#xE3;o, 2 colunas ---- */
  #printArea{display:none;}
  @media print{
    .sidebar,.sb-backdrop,.topbar,.menu-btn,.main,#eqModal,#eqToast{display:none !important;}
    #printArea{display:block !important;color:#000;padding:4mm;font-family:inherit;}
    #printArea h1{font-size:19px;margin:0 0 2px;}
    #printArea .p-sub{font-size:11px;color:#444;margin:0 0 9px;border-bottom:2px solid #FF8100;padding-bottom:6px;}
    #printArea .p-cols{column-count:2;column-gap:16px;}
    #printArea .p-sec{break-inside:avoid;-webkit-column-break-inside:avoid;margin-bottom:9px;}
    #printArea .p-sh{font-size:11.5px;font-weight:800;color:#333;border-bottom:2px solid #ccc;padding-bottom:2px;margin-bottom:3px;}
    #printArea .p-sh span{color:#777;font-weight:700;}
    #printArea .p-row{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;padding:1.3px 0;}
    #printArea .p-nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    #printArea .p-hh{color:#222;font-weight:700;white-space:nowrap;}
    @page{size:A4 portrait;margin:9mm;}
  }

</style>
</head>

  var centers={};
  dateItems.forEach(function(i){ var d=(i===anchor)?1:parseInt(i.s,10); if(d>=1&&d<=31&&centers[d]===undefined) centers[d]=i.x; });
  var days=Object.keys(centers).map(Number).sort(function(a,b){return a-b;});
  if(days.length<20) return {err:'S\u00F3 reconheci '+days.length+' dias no cabe\u00E7alho do hor\u00E1rio.'};
  var minx=centers[days[0]]-8;
  var timeYs=items.filter(function(i){return /\d{1,2}:\d{2}/.test(i.s);}).map(function(i){return i.y;});
  var legendY=timeYs.length?Math.max.apply(null,timeYs):-1;
  function nearestDay(x){ var best=days[0],bd=1e9; for(var k=0;k<days.length;k++){var dd=Math.abs(centers[days[k]]-x); if(dd<bd){bd=dd;best=days[k];}} return best; }
  var body=items.filter(function(i){ return i.y < yh-3 && (legendY<0 || i.y > legendY+4); });
  body.sort(function(a,b){ return b.y-a.y; });
  var rows=[], cur=[], lastY=null;
  body.forEach(function(i){ if(lastY===null || Math.abs(i.y-lastY)<=2.5){ cur.push(i); } else { rows.push(cur); cur=[i]; } lastY=i.y; });
  if(cur.length) rows.push(cur);
  var SECS=[['STORE MANAGER','Dire\u00E7\u00E3o'],['ASSISTANT MANAGER','Dire\u00E7\u00E3o'],['STOCK ROOM SUPERVISOR','Dire\u00E7\u00E3o'],['SUPERVISOR','Dire\u00E7\u00E3o'],['VISUAL IN STORE','Visual'],['CAIXA','Caixa'],['VENDAS CAL\u00C7ADO','Cal\u00E7ado'],['VENDAS CALCADO','Cal\u00E7ado'],['SNEAKER BAR','Cal\u00E7ado'],['VENDAS TEXTIL','T\u00EAxtil'],['VENDAS T\u00CAXTIL','T\u00EAxtil'],['LOGISTICA','Log\u00EDstica'],['LOG\u00CDSTICA','Log\u00EDstica'],['SAF','SAF']];
  function secOf(t){ var u=t.toUpperCase(); for(var k=0;k<SECS.length;k++){ if(u.indexOf(SECS[k][0])>=0) return SECS[k][1]; } return null; }
  var codeRe=/^(\d{3}[A-Z]{0,2})(-\d+h)?$/;
  var people=[], curSec=null;
  rows.forEach(function(r){
    r.sort(function(a,b){return a.x-b.x;});
    var rowText=r.map(function(i){return i.s;}).join(' ');
    var lab=r.filter(function(i){return i.x<minx;});
    var sched=r.filter(function(i){return i.x>=minx;});
    var codeItems=sched.filter(function(i){return codeRe.test(i.s);});
    var s=secOf(rowText);
    if(s && codeItems.length<3){ curSec=s; return; }
    var labStr=lab.map(function(i){return i.s;}).join(' ').trim();
    var mm=labStr.match(/^(\d+)\s*(.+)$/);
    if(!mm) return;
    var nome=mm[2].replace(/\(IHT\)/ig,'').replace(/[\*\s]+$/,'').trim();
    if(!/[A-Za-z\u00C0-\u00FA]{2,}/.test(nome)) return;
    var byDay={};
    sched.forEach(function(i){ if(codeRe.test(i.s)) byDay[nearestDay(i.x)]=i.s; });
    if(!Object.keys(byDay).length) return;
    people.push({sec:curSec||'Outros', num:mm[1], nome:nome, days:byDay});
  });
  if(people.length<15) return {err:'Reconheci poucas pessoas ('+people.length+'). O PDF pode n\u00E3o ter o formato esperado.'};
  var MN=['Janeiro','Fevereiro','Mar\u00E7o','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return {esc:{label:MN[month]+' '+year, month:month, year:year, legend:LEG, people:people}};
}
function importPDF(file){
  toast('A ler o hor\u00E1rio\u2026');
  ensurePdfjs(function(){
    if(typeof pdfjsLib==='undefined'){ toast('O leitor de PDF ainda est\u00E1 a carregar. Tenta de novo.'); return; }
    var rd=new FileReader();
    rd.onload=function(e){
      pdfjsLib.getDocument({data:new Uint8Array(e.target.result)}).promise
        .then(function(pdf){ return pdf.getPage(1); })
        .then(function(page){ return page.getTextContent(); })
        .then(function(tc){
          var items=tc.items.map(function(it){return {s:(it.str||'').trim(), x:it.transform[4], y:it.transform[5]};}).filter(function(i){return i.s;});
          var res=parseEscala(items);

        }).catch(function(err){ toast('N\u00E3o consegui ler o PDF. '+err); });

}

/* ---- gr\u00E1fico staff ao longo do dia ---- */
function staffChart(list){
  var H0=7,H1=23,W=340,H=138,top=22,bot=18,plot=H-top-bot;
  var hours=[]; for(var h=H0;h<=H1;h++) hours.push(h);
  /* pessoas presentes AO MESMO TEMPO (amostra a meio da hora): quem sai \u00E0s :15 e quem entra \u00E0s :15 nao se cruzam */
  var counts=hours.map(function(h){ var mid=h*60+30,c=0; list.forEach(function(p){ if(p.s<=mid && p.e>mid) c++; }); return c; });
  var maxc=Math.max.apply(null,counts.concat([1]));
  var peak=counts.indexOf(maxc);
  var ffVals=hours.map(function(h){ return FF[h]||0; });
  var maxff=Math.max.apply(null, ffVals.concat([0]));
  var sortedFF=ffVals.slice().sort(function(a,b){return b-a;});
  var ffThresh=sortedFF.length>=4?sortedFF[3]:(sortedFF[sortedFF.length-1]||1);
  function isFF(i){ return maxff>0 && ffVals[i]>0 && ffVals[i]>=ffThresh; }
  var n=hours.length, gap=3, bw=(W-gap*(n-1))/n;
  var svg='';
  counts.forEach(function(c,i){ var bh=maxc?(c/maxc)*plot:0; var x=i*(bw+gap); var y=(top+plot)-bh; var ff=isFF(i);
    svg+='<rect class="eq-bar-r'+(i===peak&&c>0?' peak':'')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,bh).toFixed(1)+'" rx="1.5"/>';
    if(ff){ svg+='<rect x="'+x.toFixed(1)+'" y="'+(top-8).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="4" rx="2" fill="#e0413e"/>'; }
    if(c>0) svg+='<text class="vlbl" x="'+(x+bw/2).toFixed(1)+'" y="'+(y-3).toFixed(1)+'" text-anchor="middle">'+c+'</text>';
    if(i%2===0 || ff) svg+='<text class="xlbl'+(ff?' ffl':'')+'" x="'+(x+bw/2).toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle">'+hours[i]+'h</text>';
  });
  /* marca de ABERTURA de loja \u00E0s 10h (linha tracejada) */
  var i10=hours.indexOf(10);
  if(i10>=0){ var x10=Math.max(0, i10*(bw+gap)-gap/2);
    svg+='<line x1="'+x10.toFixed(1)+'" y1="'+(top-3)+'" x2="'+x10.toFixed(1)+'" y2="'+(top+plot)+'" stroke="#0e7490" stroke-width="1.3" stroke-dasharray="3 2.5"/>';
  }
  var peakTxt=(maxc>0)?('Pico de equipa \u00E0s '+hours[peak]+'h ('+maxc+' pessoas)'):'';
  var ffHours=hours.filter(function(h,i){return isFF(i);});
  var ffTxt=ffHours.length?(' &middot; <b style="color:#e0413e">Maior fluxo de vendas: '+ffHours.map(function(h){return h+'h';}).join(', ')+'</b>'):'';
  var legend='<div class="eq-cleg"><span class="d1"></span>equipa por hora'+(maxff>0?' <span class="d2"></span>maior fluxo de vendas':'')+' <span class="d3"></span>abertura (10h)</div>';
  return '<div class="eq-chart"><h3>'+svg2('bar-chart-3')+' Staff ao longo do dia</h3><div class="sub">'+peakTxt+ffTxt+'</div><svg viewBox="0 0 '+W+' '+H+'">'+svg+'</svg>'+legend+'</div>';
}
function svg2(n){ return svg(n); }

  /* intervalo do dia + r\u00E9gua + linhas de grelha (barra direta, sem pausa) */

/* ================================================================
   Insights AI do dia \u2014 cruza a equipa escalada NESTE dia com o peso
   de vendas por hora (_vendas) e o mapa de competencias (_comp).
   Nota honesta: as vendas importadas sao o total de UMA SEMANA, por isso
   so uso o PESO relativo de cada hora, nunca euros por pessoa neste dia.
   ================================================================ */
var EQTOP=['CAIXA','ENTRADA PROCEDIMENTOS','SNEAKERS BALC\u00C3O','ARMAZ\u00C9M CAL\u00C7ADO','USO DO GPC',
  'PREPARA\u00C7\u00C3O ONLINE LS','PROCEDIMENTO PROVADORES','VENDAS POR METRO','SALES FORCE (CRIAR E CONSULTAR)',
  'REC. MOBSHOP CAMI\u00C3O','TRANSFER\u00CANCIAS','DPD','GARLAND','TIBCO'];
function eqNorm(s){ return String(s||'').toUpperCase().replace(/\s+/g,' ').trim(); }
/* quantas pessoas da lista estao em loja a uma dada hora */
function pessoasA(list, h){ var mid=h*60+30, n=0; list.forEach(function(p){ if(p.s<=mid && p.e>mid) n++; }); return n; }
function nomesA(list, h){ var mid=h*60+30; return list.filter(function(p){ return p.s<=mid && p.e>mid; }); }
/* media do mes a uma hora, nos dias do mesmo tipo (util vs fim de semana) */
function mediaMesA(h){
  if(!ESC||!ESC.people) return null;
  var fds=(selDate.getDay()===0||selDate.getDay()===6);
  var dim=new Date(ESC.year, ESC.month+1, 0).getDate(), mid=h*60+30, soma=0, dias=0;
  for(var d=1; d<=dim; d++){
    var dow=new Date(ESC.year, ESC.month, d).getDay();
    if(((dow===0||dow===6))!==fds) continue;
    var n=0;
    ESC.people.forEach(function(p){ var hh=decodeCode(p.days[d], ESC.legend); if(hh && hh[0]<=mid && hh[1]>mid) n++; });
    soma+=n; dias++;
  }
  return dias?soma/dias:null;
}
function insightsDia(dt){
  if(!dt||!dt.list||!dt.list.length) return '';
  var list=dt.list;
  var horas=Object.keys(EUR).map(Number).filter(function(h){ return EUR[h]>0; }).sort(function(a,b){return a-b;});
  var ins=[];
  var fds=(selDate.getDay()===0||selDate.getDay()===6);
  var totEur=0; horas.forEach(function(h){ totEur+=EUR[h]; }); totEur=totEur||1;

  if(!horas.length){
    ins.push({t:'i', h:'Sem vendas por hora', tx:'Importa o Excel de vendas na An\u00E1lise de Vendas para eu poder cruzar a equipa deste dia com as horas que mais pesam.'});
  } else {
    /* 1. pico de vendas vs equipa deste dia */
    var pico=horas.slice().sort(function(a,b){ return EUR[b]-EUR[a]; })[0];
    var nPico=pessoasA(list,pico), mPico=mediaMesA(pico);
    var pesoPico=Math.round(100*EUR[pico]/totEur);
    var txt='As <b>'+pico+'h</b> s\u00E3o a hora que mais pesa nas vendas ('+pesoPico+'% do dia). Hoje tens <b>'+nPico+' pessoa'+(nPico===1?'':'s')+'</b> em loja a essa hora';
    var tipo='g';
    if(mPico!=null){
      var dif=Math.round(100*(nPico/(mPico||1)-1));
      txt+=', contra uma m\u00E9dia de '+fmtD1(mPico)+' nos '+(fds?'fins de semana':'dias \u00FAteis')+' deste m\u00EAs';
      if(dif<=-20){ tipo='r'; txt+=' \u2014 <b>'+Math.abs(dif)+'% abaixo do normal</b>. \u00C9 a hora mais forte da loja: se puderes refor\u00E7ar, \u00E9 aqui.'; }
      else if(dif>=20){ tipo='i'; txt+=' \u2014 '+dif+'% acima do normal. Boa cobertura do pico.'; }
      else { txt+=' \u2014 em linha com o habitual.'; }
    } else { txt+='.'; }
    ins.push({t:tipo, h:'Pico de vendas vs equipa', tx:txt});

    /* 2. hora mais desguarnecida: muito peso de venda, pouca gente */
    var cand=horas.filter(function(h){ return pessoasA(list,h)>0; })
      .map(function(h){ return {h:h, r:(EUR[h]/totEur)/pessoasA(list,h)}; })
      .sort(function(a,b){ return b.r-a.r; });
    if(cand.length>1 && cand[0].h!==pico){
      var w=cand[0];
      ins.push({t:'i', h:'Hora mais esticada: '+w.h+'h',
        tx:'\u00C0s '+w.h+'h tens '+pessoasA(list,w.h)+' pessoa'+(pessoasA(list,w.h)===1?'':'s')+' para '+Math.round(100*EUR[w.h]/totEur)+'% da venda do dia \u2014 \u00E9, proporcionalmente, a hora em que cada pessoa leva mais carga.'});
    }

    /* 3. competencias no pico (cruzamento com o Mapa) */
    if(COMP){
      var ti=EQTOP.indexOf('SNEAKERS BALC\u00C3O');
      var mapa={}; Object.keys(COMP).forEach(function(n){ mapa[eqNorm(n)]=COMP[n]; });
      var noPico=nomesA(list,pico), aval=0, aut=0;
      noPico.forEach(function(p){ var row=mapa[eqNorm(p.nome)]; if(!row) return; aval++; if(+row[ti]===3) aut++; });
      if(aval>=2){
        ins.push({t:aut===0?'r':(aut/aval<0.4?'r':'g'), h:'Autonomia em Sneakers \u00E0s '+pico+'h',
          tx:'Das '+aval+' pessoas avaliadas que hoje est\u00E3o em loja \u00E0s '+pico+'h, <b>'+aut+' '+(aut===1?'\u00E9 aut\u00F3noma':'s\u00E3o aut\u00F3nomas')+'</b> em Sneakers Balc\u00E3o. '
            +(aut===0?'Ningu\u00E9m aut\u00F3nomo na hora mais forte \u2014 vale a pena trocar um turno ou p\u00F4r algu\u00E9m experiente ao lado.':(aut/aval<0.4?'\u00C9 pouco para a hora de maior venda.':'Boa cobertura de autonomia no pico.'))});
      }
    }
  }

  /* 4. manha: camiao (so dias uteis)
     Compara sempre o mesmo: a media das 8h-11h de hoje contra a media das
     mesmas horas nos dias do mesmo tipo do mes (antes comparava o maximo de
     hoje com a media das 9h \u2014 coisas diferentes). */
  var HM=[8,9,10,11];
  var manhaHoje=HM.reduce(function(s,h){ return s+pessoasA(list,h); },0)/HM.length;
  var mmArr=HM.map(mediaMesA).filter(function(x){ return x!=null; });
  var manhaMes=mmArr.length?(mmArr.reduce(function(a,b){return a+b;},0)/mmArr.length):null;
  if(!fds){
    var curto=(manhaMes!=null && manhaHoje<manhaMes*0.7);
    ins.push({t:curto?'r':'g', h:'Manh\u00E3 \u2014 cami\u00E3o e reposi\u00E7\u00E3o',
      tx:'De manh\u00E3 (8h-11h) tens em m\u00E9dia <b>'+fmtD1(manhaHoje)+' pessoas</b> em loja'+(manhaMes!=null?(', contra '+fmtD1(manhaMes)+' nas manh\u00E3s dos dias \u00FAteis deste m\u00EAs'):'')+'. \u00C9 a janela do cami\u00E3o e da reposi\u00E7\u00E3o'
        +(curto?' \u2014 hoje est\u00E1 bem abaixo do habitual, aten\u00E7\u00E3o \u00E0 mercadoria por repor.':'.')});
  } else {
    ins.push({t:'i', h:'Fim de semana \u2014 sem cami\u00E3o',
      tx:'Hoje n\u00E3o h\u00E1 cami\u00E3o, por isso a manh\u00E3 n\u00E3o tem carga de reposi\u00E7\u00E3o. Tens em m\u00E9dia '+fmtD1(manhaHoje)+' pessoas entre as 8h e as 11h \u2014 sem log\u00EDstica, estas horas devem seguir as vendas como as restantes.'});
  }

  /* 5. fecho \u2014 conta quem esta em loja na ultima meia hora antes de fechar
     (usar a hora cheia dava 0: os turnos acabam exatamente a essa hora) */
  var ultima=0; list.forEach(function(p){ ultima=Math.max(ultima,p.e); });
  var midF=ultima-30;
  var nF=list.filter(function(p){ return p.s<=midF && p.e>midF; }).length;
  var hhF=Math.floor(ultima/60), mmF=ultima%60;
  var horaF=hhF+(mmF?('h'+('0'+mmF).slice(-2)):'h');
  ins.push({t:nF<2?'r':'g', h:'Fecho \u00E0s '+horaF,
    tx:'Ficam <b>'+nF+' pessoa'+(nF===1?'':'s')+'</b> na \u00FAltima meia hora. '+(nF<2?'\u00C9 pouco para arrumar e fechar a loja em condi\u00E7\u00F5es.':'D\u00E1 para arrumar e fechar a loja.')});

  var cards=ins.map(function(x){
    return '<div class="eq-ins '+x.t+'"><div class="ei-h">'+esc(x.h)+'</div><div class="ei-b">'+x.tx+'</div></div>';
  }).join('');
  var nota=VSEM?('<div class="eq-inote">Peso das horas com base na '+esc(VSEM)+' (An\u00E1lise de Vendas). Comparo propor\u00E7\u00F5es, n\u00E3o euros por pessoa.</div>'):'';
  return '<div class="eq-inswrap"><div class="ei-t">'+svg('lightbulb')+' Insights AI do dia</div>'+cards+nota+'</div>';
}
function fmtD1(v){ var n=Math.round((+v||0)*10)/10; return String(n).replace('.',','); }
function wire(body, groups, order){
  mountIcons(body);
  body.querySelectorAll('.eq-chip').forEach(function(el){ el.onclick=function(){ var s=el.getAttribute('data-sec'); EQSOLO=(EQSOLO===s)?'':s; try{ sessionStorage.setItem('sz_eqsolo', EQSOLO); }catch(e){} render(); }; });
  var ec=document.getElementById('eqClear'); if(ec) ec.onclick=function(){ EQSOLO=''; try{ sessionStorage.removeItem('sz_eqsolo'); }catch(e){} render(); };
  var ab=document.getElementById('eqAddBtn'); if(ab) ab.onclick=openAdd;
  var imp=document.getElementById('eqImport2'); if(imp) imp.onclick=function(){ location.href='upload.html'; };
  body.querySelectorAll('.eq-av[data-nm]').forEach(function(el){ el.onclick=function(){ pickPhoto(el.getAttribute('data-nm')); }; });
  body.querySelectorAll('.eq-av img').forEach(function(im){ im.onerror=function(){ var av=im.parentNode; if(av){ im.style.display='none'; if(!av.querySelector('.eq-ini')){ var sp=document.createElement('span'); sp.className='eq-ini'; sp.textContent=av.getAttribute('data-ini')||''; av.insertBefore(sp, av.firstChild); } } }; });
  body.querySelectorAll('.rm').forEach(function(el){ el.onclick=function(){ var sec=el.getAttribute('data-sec'); var i=parseInt(el.getAttribute('data-i'),10); var lst=(groups&&groups[sec])||[]; lst.sort(function(a,b){ return a.s-b.s || a.nome.localeCompare(b.nome); }); var p=lst[i]; if(p&&confirm('Remover '+p.nome+' da equipa de hoje?')) removePerson(p); }; });
}

/* ---- fotos (carregadas pelo utilizador) ---- */
var photoTarget=null;
function pickPhoto(nome){ photoTarget=nome; document.getElementById('eqPhoto').click(); }
document.getElementById('eqPhoto').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f||!photoTarget) return;
  var r=new FileReader(); var nm=photoTarget;
  r.onload=function(ev){ var img=new Image(); img.onload=function(){ var mx=160,w=img.width,h=img.height; if(w>mx||h>mx){ if(w>h){ h=Math.round(h*mx/w); w=mx; } else { w=Math.round(w*mx/h); h=mx; } } var c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); FOTOS[nm]=c.toDataURL('image/jpeg',0.6); saveFotos(); render(); toast('Foto de '+nm+' guardada \u2713'); }; img.src=ev.target.result; };
  r.readAsDataURL(f);
});

/* ---- adicionar pessoa (modal) ---- */
var eqModal=document.getElementById('eqModal');
function openAdd(){ document.getElementById('eqNome').value=''; document.getElementById('eqEnt').value='10:00'; document.getElementById('eqSai').value='19:00'; eqModal.classList.add('show'); setTimeout(function(){ document.getElementById('eqNome').focus(); },60); }
function closeAdd(){ eqModal.classList.remove('show'); }
document.getElementById('eqCancel').addEventListener('click',closeAdd);
eqModal.addEventListener('click',function(e){ if(e.target===eqModal) closeAdd(); });
document.getElementById('eqSave').addEventListener('click',function(){
  var nome=document.getElementById('eqNome').value.trim();
  var sec=document.getElementById('eqSec').value;
  var ent=document.getElementById('eqEnt').value, sai=document.getElementById('eqSai').value;
  if(!nome){ alert('Escreve o nome.'); return; }
  if(!ent||!sai){ alert('Indica a entrada e a sa\u00EDda.'); return; }
  var s=hm(ent), e=hm(sai); if(e<=s) e+=1440;
  addPerson(nome, sec, s, e); closeAdd();
});

/* ---- imprimir (1 folha, por sec\u00E7\u00E3o, 2 colunas) ---- */
function printSchedule(){
  if(!ESC){ toast('Importa o hor\u00E1rio primeiro.'); return; }
  var dt=dayTeam(); if(dt.wrongMonth || !dt.list || !dt.list.length){ toast('Sem equipa para imprimir neste dia.'); return; }
  var list=dt.list.filter(function(p){ return !EQSOLO || p.sec===EQSOLO; });
  var groups={}; list.forEach(function(p){ (groups[p.sec]=groups[p.sec]||[]).push(p); });
  var order=SEC_ORDER.slice(); Object.keys(groups).forEach(function(s){ if(order.indexOf(s)<0) order.push(s); });
  var _dw=DOW[selDate.getDay()]; _dw=_dw.charAt(0).toUpperCase()+_dw.slice(1);
  var html='<h1>Hor\u00E1rio do Staff</h1><div class="p-sub"><b>'+_dw+', '+selDate.getDate()+' de '+MONS[selDate.getMonth()]+' de '+selDate.getFullYear()+'</b>'+(ESC.file?(' &middot; '+esc(ESC.file)):'')+' &middot; '+list.length+' pessoa'+(list.length>1?'s':'')+' de servi\u00E7o &middot; Sport Zone Vasco da Gama</div><div class="p-cols">';
  order.forEach(function(sec){ var lst=groups[sec]; if(!lst||!lst.length) return; lst.sort(function(a,b){ return a.s-b.s || a.nome.localeCompare(b.nome); });
    html+='<div class="p-sec"><div class="p-sh" style="border-color:'+secColor(sec)+'">'+esc(sec)+' <span>('+lst.length+')</span></div>';
    lst.forEach(function(p){ html+='<div class="p-row"><span class="p-nm">'+esc(p.nome)+(p.extra?' *':'')+'</span><span class="p-hh">'+hhmm(p.s)+'&ndash;'+hhmm(p.e)+'</span></div>'; });
    html+='</div>';
  });
  html+='</div>';
  document.getElementById('printArea').innerHTML=html;
  window.print();
}
var _pb=document.getElementById('eqPrint'); if(_pb) _pb.addEventListener('click', printSchedule);

/* ---- nuvem ---- */
function saveEscala(){ try{ localStorage.setItem('sz_escala', JSON.stringify(ESC)); }catch(e){} if(!BACKEND||!ESC) return; try{ sessionStorage.removeItem('sz_notas_cache'); }catch(e){} fetch(BACKEND,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'nota_add',seccao:'_escala',autor:ESC.label||'',texto:JSON.stringify(ESC)})}).catch(function(){}); }
function saveEdits(){ try{ localStorage.setItem('sz_escala_edit', JSON.stringify(EDITS)); }catch(e){} if(!BACKEND) return; try{ sessionStorage.removeItem('sz_notas_cache'); }catch(e){} fetch(BACKEND,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'nota_add',seccao:'_escalaEdit',autor:'',texto:JSON.stringify(EDITS)})}).catch(function(){}); }
function saveFotos(){ try{ localStorage.setItem('sz_fotos', JSON.stringify(FOTOS)); }catch(e){} if(!BACKEND) return; try{ sessionStorage.removeItem('sz_notas_cache'); }catch(e){} fetch(BACKEND,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'nota_add',seccao:'_fotos',autor:'',texto:JSON.stringify(FOTOS)})}).catch(function(){}); }
function loadFF(v){ if(v&&v.hourly){ FF={}; EUR={}; v.hourly.forEach(function(h){ var hh=parseInt(String(h.l).slice(0,2),10); if(!isNaN(hh)){ FF[hh]=+h.ff||0; EUR[hh]=+h.eur||0; } }); VSEM=v.semana||''; try{ localStorage.setItem('sz_eur', JSON.stringify(EUR)); localStorage.setItem('sz_vsem', VSEM); }catch(e){} try{ localStorage.setItem('sz_ff', JSON.stringify(FF)); }catch(e){} } }
function loadEscala(){
  try{ var ls=localStorage.getItem('sz_escala'); if(ls){ var e=JSON.parse(ls); if(e&&e.people) ESC=e; } }catch(e){}
  try{ var le=localStorage.getItem('sz_escala_edit'); if(le){ var e2=JSON.parse(le); if(e2&&e2.byDay) EDITS=e2; } }catch(e){}
  try{ var lf=localStorage.getItem('sz_fotos'); if(lf){ var f=JSON.parse(lf); if(f) FOTOS=f; } }catch(e){}
  try{ var lff=localStorage.getItem('sz_ff'); if(lff){ var ff=JSON.parse(lff); if(ff) FF=ff; } }catch(e){}
  try{ var leu=localStorage.getItem('sz_eur'); if(leu){ var eu=JSON.parse(leu); if(eu) EUR=eu; } }catch(e){}
  try{ VSEM=localStorage.getItem('sz_vsem')||''; }catch(e){}
  try{ EQSOLO=sessionStorage.getItem('sz_eqsolo')||''; }catch(e){}
  /* se ja houver copia local, mostra-a de imediato \u2014 nao ha nada a esperar */
  if(ESC) ESCLOAD=false;
  pickToday(); render();
  if(!BACKEND){ ESCLOAD=false; render(); return; }
  fetch(BACKEND+'?action=notas&t='+Date.now()).then(function(r){return r.json();}).then(function(j){
    var ns=(j&&j.notas)?j.notas:[]; function latest(sec){ var a=ns.filter(function(n){return String(n.seccao)===sec;}); if(!a.length) return null; a.sort(function(x,y){return new Date(y.data)-new Date(x.data);}); try{ return JSON.parse(a[0].texto); }catch(e){ return null; } }
    var e=latest('_escala'); if(e&&e.people){ ESC=e; }
    var ed=latest('_escalaEdit'); if(ed&&ed.byDay){ EDITS=ed; }
    var fo=latest('_fotos'); if(fo&&typeof fo==='object'){ FOTOS=fo; }
    loadFF(latest('_vendas'));
    var cp=latest('_comp'); if(cp&&typeof cp==='object') COMP=cp;
    ESCLOAD=false; pickToday(); render();
  }).catch(function(){ ESCLOAD=false; render(); });
}


document.getElementById('eqFile').addEventListener('change',function(e){ var f=e.target.files&&e.target.files[0]; if(f) importPDF(f); e.target.value=''; });
loadEscala();
